<style>
  :root{
    --paper:#E7EAED; --card:#FFFFFF;
    --ink:#16202A; --ink-2:#5D6B77; --ink-3:#98A4AE;
    --line:#D3D9DE; --linea-suave:#EDF0F2;
    --th:#F4F6F7; --sutil:#F7F9FA; --tag:#EFF2F4; --fill:#E3E7EA;
    --jade:#17705A; --jade-fuerte:#0E4A3C; --jade-soft:#D9E8E3;
    --amber:#A9750B; --amber-soft:#F6EAD2;
    --rust:#9A3B39; --rust-soft:#F3DEDD;
    --h0:#F1F4F5; --h1:#DCE9E4; --h2:#A9CCC0; --h3:#4E9682; --h4:#17705A;
    --h2-txt:#0E4A3C;
    --shadow:0 1px 0 rgba(22,32,42,.06);
    --r:5px;
  }
  html[data-tema="oscuro"]{
    --paper:#11171C; --card:#1A2229;
    --ink:#E9EEF2; --ink-2:#9BA9B4; --ink-3:#6B7B88;
    --line:#2B353D; --linea-suave:#232C34;
    --th:#212A32; --sutil:#1F272E; --tag:#242E36; --fill:#2B353D;
    --jade:#4FA98B; --jade-fuerte:#7BC7AB; --jade-soft:#1D3A32;
    --amber:#D9A03C; --amber-soft:#3A2F18;
    --rust:#D97B76; --rust-soft:#3B2422;
    --h0:#212A32; --h1:#22443A; --h2:#2F6B58; --h3:#3E8E75; --h4:#4FA98B;
    --h2-txt:#CDE8DE;
    --shadow:none;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:Inter,system-ui,-apple-system,sans-serif;
    font-size:15px; line-height:1.5; padding-bottom:88px;
    transition:background .2s ease,color .2s ease;
  }
  h1,h2,h3,.num{font-family:'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}

  header{padding:18px 0 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .fecha{font-family:'Space Grotesk';font-size:19px;font-weight:600;letter-spacing:-.2px}
  .fecha span{display:block;font-family:Inter;font-size:12.5px;font-weight:400;color:var(--ink-2);letter-spacing:0}

  /* relojes */
  .relojes{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:18px;position:relative;margin-top:16px}
  .analogo{width:104px;height:104px;min-width:104px}
  .analogo circle.cara{fill:var(--sutil);stroke:var(--line);stroke-width:1.5}
  .analogo line.tick{stroke:var(--ink-3);stroke-width:1.2}
  .analogo line.tick.g{stroke:var(--ink-2);stroke-width:2.4}
  .analogo line.h{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
  .analogo line.m{stroke:var(--ink);stroke-width:2.8;stroke-linecap:round}
  .analogo line.s{stroke:var(--jade);stroke-width:1.4;stroke-linecap:round}
  .analogo circle.eje{fill:var(--ink)}
  .digital{flex:1;min-width:0}
  .hora{font-family:'Space Grotesk';font-size:38px;font-weight:700;letter-spacing:-2.2px;line-height:1;font-variant-numeric:tabular-nums}
  .hora i{font-style:normal;font-size:18px;font-weight:500;color:var(--ink-3);letter-spacing:-.5px;margin-left:3px}
  .hora em{font-style:normal;font-size:14px;font-weight:500;color:var(--ink-2);margin-left:5px}
  .dia-largo{font-size:13.5px;color:var(--ink-2);margin-top:7px;line-height:1.35}
  .dia-largo b{display:block;color:var(--ink);font-weight:600;font-size:14.5px}
  .racha-linea{margin-top:10px;padding-top:10px;border-top:1px solid var(--linea-suave);font-size:12.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
  .racha-linea b{font-family:'Space Grotesk';color:var(--ink);font-weight:600}
  .tema-btn{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
  .tema-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  @media (max-width:350px){ .relojes{gap:12px} .analogo{width:86px;height:86px;min-width:86px} .hora{font-size:31px} }

  /* medidor */
  .medidor{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
  .medidor-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .pct{font-family:'Space Grotesk';font-size:44px;font-weight:700;letter-spacing:-2px;line-height:1}
  .pct small{font-size:20px;font-weight:500;letter-spacing:-1px;color:var(--ink-2)}
  .medidor-lab{font-size:12.5px;color:var(--ink-2);text-align:right;max-width:44%}
  .segs{display:flex;gap:3px;height:26px}
  .seg{flex:1;background:var(--fill);border-radius:1px;transition:background .25s ease}
  .seg.on{background:var(--jade)}
  .seg.on.parcial{background:var(--h3)}
  .medidor-pie{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--ink-2)}

  /* nav */
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  .nav-in{max-width:760px;margin:0 auto;display:flex}
  nav button{flex:1;padding:11px 2px 13px;font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:500}
  nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  nav button.act{color:var(--jade)}

  section{display:none;padding-top:4px}
  section.act{display:block}
  .tit{font-size:12.5px;color:var(--ink-2);margin:22px 0 9px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .tit b{font-weight:600;color:var(--ink);font-size:15px;font-family:'Space Grotesk'}

  /* listas */
  .lista{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
  .fila{display:flex;gap:12px;padding:13px 14px;border-bottom:1px solid var(--linea-suave);align-items:flex-start}
  .fila:last-child{border-bottom:none}
  .check{width:23px;height:23px;min-width:23px;border:1.8px solid var(--ink-3);border-radius:50%;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:.15s}
  .check.cuadro{border-radius:4px}
  .check svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
  .check.on{background:var(--jade);border-color:var(--jade)}
  .check.on svg{opacity:1}
  .cuerpo{flex:1;min-width:0}
  .nom{font-weight:500;line-height:1.35}
  .fila.hecho .nom{color:var(--ink-3);text-decoration:line-through}
  .desc{font-size:12.8px;color:var(--ink-2);margin-top:3px;line-height:1.42}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
  .tag{font-size:11.5px;color:var(--ink-2);background:var(--tag);padding:2px 7px;border-radius:3px;font-weight:500}
  .tag.jade{background:var(--jade-soft);color:var(--jade)}
  .tag.amber{background:var(--amber-soft);color:var(--amber)}
  .tag.rust{background:var(--rust-soft);color:var(--rust)}
  .mini{font-family:'Space Grotesk';font-size:12px;color:var(--ink-2);white-space:nowrap;text-align:right;padding-top:2px}
  .mini b{display:block;font-size:16px;color:var(--ink);font-weight:600}
  .borrar{color:var(--ink-3);font-size:18px;line-height:1;padding:2px 4px}
  .vacio{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--ink-2);font-size:13.5px}

  /* botones */
  .btn{background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:var(--r);font-weight:500;font-size:14.5px;width:100%;text-align:center}
  .btn.ghost{background:none;color:var(--jade);border:1px solid var(--line);font-weight:600}
  .btn.chico{width:auto;padding:7px 12px;font-size:13px}
  .filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;scrollbar-width:none}
  .filtros::-webkit-scrollbar{display:none}
  .filtros button{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:20px;font-size:13px;color:var(--ink-2);white-space:nowrap}
  .filtros button.act{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* calendario */
  .cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
  .cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-top b{font-family:'Space Grotesk';font-size:16px;font-weight:600}
  .cal-top button{font-size:20px;color:var(--ink-2);padding:2px 10px}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
  .dow div{text-align:center;font-size:11px;color:var(--ink-3);font-weight:500}
  .dias{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dia{aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-size:12.5px;background:var(--h0);color:var(--ink-2);border:1px solid transparent}
  .dia.n0{background:var(--h0)}
  .dia.n1{background:var(--h1);color:var(--jade)}
  .dia.n2{background:var(--h2);color:var(--h2-txt)}
  .dia.n3{background:var(--h3);color:#fff}
  .dia.n4{background:var(--h4);color:#fff;font-weight:600}
  .dia.hoy{border-color:var(--ink);font-weight:700}
  .dia.fuera{opacity:.32}
  .dia.futuro{background:transparent;border:1px dashed var(--line);color:var(--ink-3)}
  .leyenda{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11.5px;color:var(--ink-2)}
  .leyenda i{width:15px;height:15px;border-radius:3px;display:inline-block}

  /* dinero */
  .saldo{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
  .saldo-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
  .saldo-num{font-family:'Space Grotesk';font-size:36px;font-weight:700;letter-spacing:-1.6px;line-height:1}
  .saldo-num.rojo{color:var(--rust)}
  .saldo-lab{font-size:12.5px;color:var(--ink-2);margin-top:4px}
  .mes-nav{display:flex;align-items:center;gap:4px;font-family:'Space Grotesk';font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
  .mes-nav button{padding:2px 8px;font-size:17px;color:var(--ink-3)}
  .flujo{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--fill)}
  .flujo i{display:block;height:100%}
  .flujo-lab{display:flex;justify-content:space-between;margin-top:9px;font-size:12.5px;gap:6px}
  .flujo-lab span{display:flex;align-items:center;gap:5px;color:var(--ink-2)}
  .flujo-lab b{font-family:'Space Grotesk';color:var(--ink);font-weight:600}
  .punto{width:8px;height:8px;border-radius:2px;display:inline-block}
  .meta-c{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
  .meta-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .meta-cifra{font-family:'Space Grotesk';font-size:13px;color:var(--ink-2);white-space:nowrap;text-align:right}
  .meta-cifra b{display:block;font-size:17px;color:var(--ink);font-weight:700}
  .meta-barra{height:8px;background:var(--fill);border-radius:4px;margin:11px 0 9px;overflow:hidden}
  .meta-barra i{display:block;height:100%;background:var(--jade);border-radius:4px;transition:width .3s ease}
  .meta-pie{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
  .monto{font-family:'Space Grotesk';font-weight:600;font-size:15px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
  .monto.ing{color:var(--jade)}
  .monto.gas{color:var(--rust)}
  .monto.aho{color:var(--ink-2)}
  .tipo-sel{display:flex;gap:6px}
  .tipo-sel button{flex:1;padding:11px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font-size:13.5px;color:var(--ink-2)}
  .tipo-sel button.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}

  /* estadísticas */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;box-shadow:var(--shadow)}
  .kpi b{display:block;font-family:'Space Grotesk';font-size:26px;font-weight:700;letter-spacing:-1px;line-height:1.15}
  .kpi span{font-size:12px;color:var(--ink-2)}
  .barras{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
  .barras-g{display:flex;gap:4px;align-items:flex-end;height:104px}
  .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
  .col i{display:block;background:var(--jade);border-radius:1px;min-height:2px}
  .col.vacia i{background:var(--fill)}
  .col.hoy-col i{background:var(--jade-fuerte)}
  .ejes{display:flex;gap:4px;margin-top:6px}
  .ejes div{flex:1;text-align:center;font-size:9.5px;color:var(--ink-3);font-family:'Space Grotesk'}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
  th{text-align:left;font-size:11.5px;color:var(--ink-2);font-weight:600;padding:9px 10px;background:var(--th);border-bottom:1px solid var(--line)}
  th.r,td.r{text-align:right}
  td{padding:10px;border-bottom:1px solid var(--linea-suave);font-size:13.5px}
  tr:last-child td{border-bottom:none}
  td.n{font-family:'Space Grotesk';font-weight:600;font-variant-numeric:tabular-nums}
  .barrita{height:5px;background:var(--fill);border-radius:3px;margin-top:5px;overflow:hidden}
  .barrita i{display:block;height:100%;background:var(--jade)}
  .periodo-sel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;box-shadow:var(--shadow);margin:16px 0 14px}
  .periodo-sel .filtros{margin-bottom:10px}
  .periodo-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .periodo-nav b{font-family:'Space Grotesk';font-size:15px;font-weight:600;text-align:center;flex:1;line-height:1.25}
  .periodo-nav button{padding:3px 12px;font-size:20px;color:var(--ink-2)}
  .periodo-nav button[disabled]{opacity:.3}
  .acc-dia{display:flex;gap:8px;margin-top:9px}
  .acc-dia .btn{flex:1;font-size:13px;padding:9px 6px}

  /* ajustes */
  .ajuste{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
  .ajuste .nom{margin-bottom:9px}
  .opciones{display:flex;gap:6px}
  .opciones button{flex:1;padding:9px 4px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);font-size:13px;color:var(--ink-2)}
  .opciones button.on{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:600}

  /* formulario */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.46);z-index:60;display:none;align-items:flex-end;justify-content:center}
  .modal.act{display:flex}
  .hoja{background:var(--paper);width:100%;max-width:760px;border-radius:14px 14px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
  .hoja h3{margin:0 0 14px;font-size:18px;font-weight:600}
  label{display:block;font-size:12.5px;color:var(--ink-2);margin:12px 0 5px}
  .campo{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
  textarea.campo{min-height:66px;resize:vertical;line-height:1.45}
  .dias-sem{display:flex;gap:5px}
  .dias-sem button{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font-size:12.5px;color:var(--ink-2)}
  .dias-sem button.on{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:600}
  .par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .acciones{display:flex;gap:9px;margin-top:20px}
  .acciones .btn{flex:1}
  @media (min-width:620px){ .kpis{grid-template-columns:repeat(4,1fr)} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ============ almacenamiento ============ */
const CLAVE='agendaPro:v1';
let memoria=null, avisado=false;
async function leer(){
  try{
    if(typeof window.storage!=='undefined'&&window.storage){
      const r=await window.storage.get(CLAVE);return r?JSON.parse(r.value):null;
    }
    const r=localStorage.getItem(CLAVE);return r?JSON.parse(r):null;
  }catch(e){return memoria;}
}
async function guardarLocal(d){
  memoria=d;
  try{
    if(typeof window.storage!=='undefined'&&window.storage){await window.storage.set(CLAVE,JSON.stringify(d));return;}
    localStorage.setItem(CLAVE,JSON.stringify(d));
  }catch(e){if(!avisado){avisado=true;alert(t('noGuardo'));}}
}
async function escribir(d){
  d.actualizado=new Date().toISOString();
  await guardarLocal(d);
  programarSubida();
}

/* ============ cálculo ============ */
function aplicaHoy(h,f){return h.dias[idxSem(f)]===1;}
function delDia(f){return D.habitos.filter(h=>aplicaHoy(h,f));}
function marcado(f,id){return !!(D.registro[f]&&D.registro[f][id]);}
function pctDia(fs){const hs=delDia(desdeIso(fs));if(!hs.length)return null;
  return Math.round(hs.filter(h=>marcado(fs,h.id)).length/hs.length*100);}
function rachaGlobal(){let n=0;const d=new Date();
  if(pctDia(hoyIso())===null||pctDia(hoyIso())<100)d.setDate(d.getDate()-1);
  for(let i=0;i<400;i++){const p=pctDia(iso(d));
    if(p===null){d.setDate(d.getDate()-1);continue;}
    if(p===100){n++;d.setDate(d.getDate()-1);}else break;}
  return n;}
function rachaHabito(h){let n=0;const d=new Date();
  for(let i=0;i<400;i++){
    if(!aplicaHoy(h,d)){d.setDate(d.getDate()-1);continue;}
    const f=iso(d);
    if(marcado(f,h.id)){n++;d.setDate(d.getDate()-1);}
    else if(f===hoyIso()){d.setDate(d.getDate()-1);}else break;}
  return n;}
function movsDelMes(d){const p=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  return D.movs.filter(m=>m.fecha.startsWith(p));}
function suma(l,tp){return l.filter(m=>m.tipo===tp).reduce((a,m)=>a+m.monto,0);}
function ahorradoEn(id){return D.movs.filter(m=>m.tipo==='ahorro'&&m.metaId===id).reduce((a,m)=>a+m.monto,0);}

    const a=i*6*Math.PI/180,gr=i%5===0,r1=gr?38:41,r2=44;
    g+='<line class="tick'+(gr?' g':'')+'" x1="'+(50+r1*Math.sin(a)).toFixed(2)+'" y1="'+(50-r1*Math.cos(a)).toFixed(2)+
       '" x2="'+(50+r2*Math.sin(a)).toFixed(2)+'" y2="'+(50-r2*Math.cos(a)).toFixed(2)+'"/>';
  }
  document.getElementById('ticks').innerHTML=g;
}
function ticTac(){
  const n=new Date(),s=n.getSeconds(),m=n.getMinutes(),h=n.getHours()%12;
  const gira=(el,a)=>document.getElementById(el).setAttribute('transform','rotate('+a+' 50 50)');
  gira('agujaS',s*6);gira('agujaM',m*6+s*0.1);gira('agujaH',h*30+m*0.5);
  const h24=n.getHours(),h12=h24%12||12;
  document.getElementById('horaDigital').innerHTML=
    h12+':'+String(m).padStart(2,'0')+'<i>'+String(s).padStart(2,'0')+'</i><em>'+(h24<12?t('am'):t('pm'))+'</em>';
  const dl=cap(DIAS_L()[n.getDay()]);
  document.getElementById('fechaLarga').innerHTML=
    '<b>'+(idioma==='es'
      ? dl+' '+n.getDate()+' de '+MESES()[n.getMonth()]
      : dl+', '+MESES()[n.getMonth()]+' '+n.getDate())+'</b>'+
    t('semana')+' '+semanaDelAno(n)+' · '+n.getFullYear();
}

function lunesDe(d){const x=new Date(d);x.setDate(x.getDate()-idxSem(x));x.setHours(0,0,0,0);return x;}
function rango(){
  const hoy=new Date();hoy.setHours(0,0,0,0);
  let ini,fin,tit;
  if(periodo==='dia'){
    ini=new Date(hoy);ini.setDate(ini.getDate()+offset);fin=new Date(ini);
    tit=idioma==='es'?cap(DIAS_L()[ini.getDay()])+' '+ini.getDate()+' de '+MESES()[ini.getMonth()]
      :cap(DIAS_L()[ini.getDay()])+', '+MESES()[ini.getMonth()]+' '+ini.getDate();
  }else if(periodo==='semana'){
    ini=lunesDe(hoy);ini.setDate(ini.getDate()+offset*7);fin=new Date(ini);fin.setDate(fin.getDate()+6);
    tit=cap(t('semana'))+' '+semanaDelAno(ini)+' · '+ini.getDate()+' '+MESES()[ini.getMonth()].slice(0,3)+
        ' – '+fin.getDate()+' '+MESES()[fin.getMonth()].slice(0,3);
  }else{
    ini=new Date(hoy.getFullYear(),hoy.getMonth()+offset,1);
    fin=new Date(ini.getFullYear(),ini.getMonth()+1,0);
    tit=cap(MESES()[ini.getMonth()])+' '+ini.getFullYear();
  }
  const dias=[],c=new Date(ini);
  while(c<=fin){dias.push(iso(c));c.setDate(c.getDate()+1);}
  return{ini,fin,tit,dias,pasados:dias.filter(f=>f<=hoyIso())};
}
function setPeriodo(p){periodo=p;offset=0;pintarStats();}
function moverPeriodo(n){if(n>0&&offset>=0)return;offset+=n;pintarStats();}

  document.getElementById('selPeriodo').innerHTML=[['dia','pDia'],['semana','pSemana'],['mes','pMes']].map(x=>
    '<button class="'+(periodo===x[0]?'act':'')+'" onclick="setPeriodo(\''+x[0]+'\')">'+t(x[1])+'</button>').join('');
  document.getElementById('periodoTit').textContent=R.tit;
  const ad=document.querySelector('.periodo-nav button:last-child');
  if(ad)offset>=0?ad.setAttribute('disabled',''):ad.removeAttribute('disabled');

  let apl=0,cum=0;
  R.pasados.forEach(f=>{const hs=delDia(desdeIso(f));apl+=hs.length;cum+=hs.filter(h=>marcado(f,h.id)).length;});
  const pct=apl?Math.round(cum/apl*100):0;
  const perf=R.pasados.filter(f=>pctDia(f)===100).length;
  const hechas=D.tareas.filter(x=>x.hecho&&x.hechoEn&&R.dias.includes(x.hechoEn)).length;
  const movs=D.movs.filter(m=>R.dias.includes(m.fecha));
  const ing=suma(movs,'ingreso'),gas=suma(movs,'gasto'),aho=suma(movs,'ahorro');
  document.getElementById('kpis').innerHTML=
    kpi(pct+'%',t('cumplimiento'))+kpi(cum+'/'+apl,t('habitosCumplidos'))+
    kpi(perf,t('diasAl100'))+kpi(hechas,t('tareasCompl'));

  const bd=periodo==='dia'
    ?(()=>{const l=lunesDe(R.ini),a=[];for(let i=0;i<7;i++){const d=new Date(l);d.setDate(d.getDate()+i);a.push(iso(d));}return a;})()
    :R.dias;
  document.getElementById('grafLab').textContent=periodo==='dia'?t('suSemana'):R.dias.length+' '+t('diasTxt');
  let g='',e='';
  bd.forEach(f=>{const p=pctDia(f),fu=f>hoyIso(),mk=(periodo==='dia'&&f===R.dias[0]);
    g+='<div class="col'+(p===null||p===0||fu?' vacia':'')+(mk?' hoy-col':'')+'"><i style="height:'+(fu||p===null?3:Math.max(p,3))+'%"></i></div>';
    e+='<div>'+desdeIso(f).getDate()+'</div>';});
  document.getElementById('graf').innerHTML=g;
  document.getElementById('grafEjes').innerHTML=e;

  document.getElementById('labHabitos').textContent=R.pasados.length+' '+(R.pasados.length===1?t('diaTxt'):t('diasTxt'));
  document.getElementById('tablaHabitos').innerHTML=D.habitos.length?
    '<table><thead><tr><th>'+t('thHabito')+'</th><th class="r">'+t('thCumpl')+'</th><th class="r">%</th><th class="r">'+t('thRacha')+'</th></tr></thead><tbody>'+
    D.habitos.map(h=>{let a=0,o=0;
      R.pasados.forEach(f=>{if(aplicaHoy(h,desdeIso(f))){a++;if(marcado(f,h.id))o++;}});
      const p=a?Math.round(o/a*100):0;
      return '<tr><td>'+esc(h.nom)+'</td><td class="r n">'+o+'/'+a+'</td>'+
        '<td class="r n" style="color:'+(a?color(p):'var(--ink-3)')+'">'+(a?p+'%':'—')+'</td>'+
        '<td class="r n">'+rachaHabito(h)+'</td></tr>';}).join('')+'</tbody></table>':
    '<div class="vacio">'+t('agregaHabitos')+'</div>';

  const lt=D.tareas.filter(x=>(x.hecho&&x.hechoEn&&R.dias.includes(x.hechoEn))||(!x.hecho&&x.fecha&&R.dias.includes(x.fecha)));
  const cats={};lt.forEach(x=>{cats[x.cat]=cats[x.cat]||{h:0,p:0};x.hecho?cats[x.cat].h++:cats[x.cat].p++;});
  const k=Object.keys(cats);
  document.getElementById('labTareas').textContent=hechas+' / '+lt.length;
  document.getElementById('tablaTareas').innerHTML=k.length?
    '<table><thead><tr><th>'+t('categoria')+'</th><th class="r">'+t('thHechas')+'</th><th class="r">'+t('thPendientes')+'</th><th class="r">%</th></tr></thead><tbody>'+
    k.map(c=>{const x=cats[c],to=x.h+x.p,p=to?Math.round(x.h/to*100):0;
      return '<tr><td>'+esc(c)+'</td><td class="r n">'+x.h+'</td><td class="r n">'+x.p+'</td>'+
        '<td class="r n" style="color:'+color(p)+'">'+p+'%</td></tr>';}).join('')+'</tbody></table>':
    '<div class="vacio">'+t('sinTareasPeriodo')+'</div>';

  document.getElementById('labDinero').textContent=movs.length?movs.length+' '+t('movimientos'):t('sinMovimientos');
  document.getElementById('tablaDinero').innerHTML=movs.length?
    '<table><tbody>'+
    '<tr><td>'+t('ingresos')+'</td><td class="r n" style="color:var(--jade)">'+fmt(ing)+'</td></tr>'+
    '<tr><td>'+t('gastos')+'</td><td class="r n" style="color:var(--rust)">'+fmt(gas)+'</td></tr>'+
    '<tr><td>'+t('ahorroApartado')+'</td><td class="r n" style="color:var(--amber)">'+fmt(aho)+'</td></tr>'+
    '<tr><td><b>'+t('saldo')+'</b></td><td class="r n" style="color:'+((ing-gas-aho)<0?'var(--rust)':'var(--jade)')+'">'+fmt(ing-gas-aho)+'</td></tr>'+
    '</tbody></table>':'<div class="vacio">'+t('sinMovsPeriodo')+'</div>';

  let filas='',hay=false;
  for(let i=0;i<6;i++){
    const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);
    const l=movsDelMes(d);if(!l.length)continue;hay=true;
    const mi=suma(l,'ingreso'),mg=suma(l,'gasto'),ma=suma(l,'ahorro'),sa=mi-mg-ma;
    filas+='<tr><td>'+MESES()[d.getMonth()].slice(0,3)+' '+String(d.getFullYear()).slice(2)+
      '</td><td class="r n" style="color:var(--jade)">'+fmt(mi)+'</td><td class="r n" style="color:var(--rust)">'+fmt(mg)+
      '</td><td class="r n">'+fmt(ma)+'</td><td class="r n" style="color:'+(sa<0?'var(--rust)':'var(--jade)')+'">'+fmt(sa)+'</td></tr>';
  }
  const at=D.movs.filter(m=>m.tipo==='ahorro').reduce((a,m)=>a+m.monto,0);
  document.getElementById('tablaMeses').innerHTML=hay?
    '<table><thead><tr><th>'+t('thMes')+'</th><th class="r">'+t('ingresos')+'</th><th class="r">'+t('gastos')+
    '</th><th class="r">'+t('thAhorro')+'</th><th class="r">'+t('thSaldo')+'</th></tr></thead><tbody>'+filas+
    '<tr><td colspan="3">'+t('ahorradoTotal')+'</td><td class="r n" colspan="2" style="color:var(--jade)">'+fmt(at)+'</td></tr></tbody></table>':
    '<div class="vacio">'+t('registraDinero')+'</div>';
}
function kpi(v,l){return '<div class="kpi"><b>'+v+'</b><span>'+l+'</span></div>';}

/* ============ acciones ============ */
async function alternarHabito(id,fecha){
  const f=fecha||hoyIso();
  D.registro[f]=D.registro[f]||{};
  if(D.registro[f][id])delete D.registro[f][id];else D.registro[f][id]=true;
  if(!Object.keys(D.registro[f]).length)delete D.registro[f];
  await escribir(D);pintar();
}
async function alternarTarea(id,fecha){
  const x=D.tareas.find(y=>y.id===id);if(!x)return;
  x.hecho=!x.hecho;x.hechoEn=x.hecho?(fecha||hoyIso()):null;
  await escribir(D);pintar();
}
async function borrarTarea(ev,id){ev.stopPropagation();D.tareas=D.tareas.filter(x=>x.id!==id);await escribir(D);pintar();}
async function borrarHabito(ev,id){ev.stopPropagation();
  if(!confirm(t('confBorrarHabito')))return;
  D.habitos=D.habitos.filter(h=>h.id!==id);await escribir(D);pintar();}
function setFiltro(f){filtroTarea=f;pintarTareas();}
function verDia(f){diaVista=f;pintarDetalle();}
function moverMes(n){mesVista=new Date(mesVista.getFullYear(),mesVista.getMonth()+n,1);pintarCal();}
function moverMesDinero(n){mesDinero=new Date(mesDinero.getFullYear(),mesDinero.getMonth()+n,1);pintarDinero();}
function cerrar(id){document.getElementById(id).classList.remove('act');}

let editHabito=null,diasSel=[1,1,1,1,1,1,1];
function abrirHabito(id){
  editHabito=id||null;const h=id?D.habitos.find(x=>x.id===id):null;
  document.getElementById('tituloHabito').textContent=h?t('editarHabito'):t('nuevoHabitoTit');
  document.getElementById('hNom').value=h?h.nom:'';
  document.getElementById('hDesc').value=h?h.desc:'';
  document.getElementById('hCat').value=h?h.cat:t('areas')[0];
  document.getElementById('hHora').value=h?h.hora:t('momentos')[0];
  diasSel=h?h.dias.slice():[1,1,1,1,1,1,1];
  pintarDiasSem();document.getElementById('modalHabito').classList.add('act');
}
function pintarDiasSem(){
  document.getElementById('hDias').innerHTML=SEM().map((d,i)=>
    '<button class="'+(diasSel[i]?'on':'')+'" onclick="togDia('+i+')">'+d+'</button>').join('');
}
function togDia(i){diasSel[i]=diasSel[i]?0:1;pintarDiasSem();}
async function guardarHabito(){
  const nom=document.getElementById('hNom').value.trim();
  if(!nom){document.getElementById('hNom').focus();return;}
  if(!diasSel.some(d=>d)){alert(t('elegirDia'));return;}
  const dt={nom,desc:document.getElementById('hDesc').value.trim(),
    cat:document.getElementById('hCat').value,hora:document.getElementById('hHora').value,dias:diasSel.slice()};
  if(editHabito)Object.assign(D.habitos.find(h=>h.id===editHabito),dt);
  else D.habitos.push({id:uid(),...dt});
  await escribir(D);cerrar('modalHabito');pintar();
}

let editTarea=null;
function abrirTarea(id,fechaPre){
  editTarea=id||null;const x=id?D.tareas.find(y=>y.id===id):null;
  document.getElementById('tituloTarea').textContent=x?t('editarTarea'):t('nuevaTareaTit');
  document.getElementById('tNom').value=x?x.nom:'';
  document.getElementById('tDesc').value=x?x.desc:'';
  document.getElementById('tFecha').value=x?x.fecha:(fechaPre||hoyIso());
  document.getElementById('tPri').value=x?x.pri:'media';
  document.getElementById('tCat').value=x?x.cat:t('catsTarea')[0];
  document.getElementById('modalTarea').classList.add('act');
}
async function guardarTarea(){
  const nom=document.getElementById('tNom').value.trim();
  if(!nom){document.getElementById('tNom').focus();return;}
  const dt={nom,desc:document.getElementById('tDesc').value.trim(),
    fecha:document.getElementById('tFecha').value,pri:document.getElementById('tPri').value,
    cat:document.getElementById('tCat').value};
  if(editTarea)Object.assign(D.tareas.find(x=>x.id===editTarea),dt);
  else D.tareas.push({id:uid(),...dt,hecho:false});
  await escribir(D);cerrar('modalTarea');pintar();
}

let tipoMov='gasto';
function abrirMov(tipo,fechaPre){
  tipoMov=tipo||'gasto';
  document.getElementById('mMonto').value='';
  document.getElementById('mDesc').value='';
  document.getElementById('mFecha').value=fechaPre||hoyIso();
  pintarTipoSel();document.getElementById('modalMov').classList.add('act');
}
function pintarTipoSel(){
  document.getElementById('tituloMov').textContent=tipoMov==='ingreso'?t('registrarIngresoTit'):t('registrarGastoTit');
  document.getElementById('mTipo').innerHTML=[['gasto','gasto'],['ingreso','ingreso']].map(x=>
    '<button class="'+(tipoMov===x[0]?'on':'')+'" onclick="setTipoMov(\''+x[0]+'\')">'+t(x[1])+'</button>').join('');
  document.getElementById('mCat').innerHTML=(tipoMov==='ingreso'?t('catsIngreso'):t('catsGasto'))
    .map(c=>'<option>'+c+'</option>').join('');
}
function setTipoMov(x){tipoMov=x;pintarTipoSel();}
async function guardarMov(){
  const monto=parseFloat(document.getElementById('mMonto').value);
  if(!monto||monto<=0){document.getElementById('mMonto').focus();return;}
  D.movs.push({id:uid(),tipo:tipoMov,monto,cat:document.getElementById('mCat').value,
    desc:document.getElementById('mDesc').value.trim(),fecha:document.getElementById('mFecha').value||hoyIso()});
  await escribir(D);cerrar('modalMov');pintar();
}
async function borrarMov(ev,id){ev.stopPropagation();D.movs=D.movs.filter(m=>m.id!==id);await escribir(D);pintar();}

function abrirMeta(){
  ['gNom','gDesc','gObj','gFecha'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('modalMeta').classList.add('act');
}
async function guardarMeta(){
  const nom=document.getElementById('gNom').value.trim(),obj=parseFloat(document.getElementById('gObj').value);
  if(!nom){document.getElementById('gNom').focus();return;}
  if(!obj||obj<=0){document.getElementById('gObj').focus();return;}
  D.metas.push({id:uid(),nom,desc:document.getElementById('gDesc').value.trim(),obj,
    fecha:document.getElementById('gFecha').value});
  await escribir(D);cerrar('modalMeta');pintar();
}
async function borrarMeta(ev,id){ev.stopPropagation();
  if(!confirm(t('confBorrarMeta')))return;
  D.metas=D.metas.filter(g=>g.id!==id);D.movs=D.movs.filter(m=>m.metaId!==id);
  await escribir(D);pintar();}

let metaAbono=null;
function abrirAbono(id){
  metaAbono=id;const g=D.metas.find(x=>x.id===id);
  document.getElementById('tituloAbono').textContent=t('abonarA')+' '+(g?g.nom:'');
  document.getElementById('aMonto').value='';
  document.getElementById('aFecha').value=hoyIso();
  document.getElementById('modalAbono').classList.add('act');
}
async function guardarAbono(){
  const monto=parseFloat(document.getElementById('aMonto').value);
  if(!monto||monto<=0){document.getElementById('aMonto').focus();return;}
  const g=D.metas.find(x=>x.id===metaAbono);
  D.movs.push({id:uid(),tipo:'ahorro',monto,cat:t('ahorro'),metaId:metaAbono,
    desc:t('abonoA')+' '+(g?g.nom:''),fecha:document.getElementById('aFecha').value||hoyIso()});
  await escribir(D);cerrar('modalAbono');pintar();
}

function exportarCSV(){
  const f=[],d=new Date();d.setDate(d.getDate()-89);
  for(let i=0;i<90;i++){f.push(iso(d));d.setDate(d.getDate()+1);}
  let csv='Fecha,Dia,'+D.habitos.map(h=>'"'+h.nom.replace(/"/g,'""')+'"').join(',')+',Cumplidos,Aplican,Porcentaje\n';
  f.forEach(fe=>{const dd=desdeIso(fe),hs=delDia(dd);
    const cols=D.habitos.map(h=>!aplicaHoy(h,dd)?'':(marcado(fe,h.id)?'1':'0'));
    const ok=hs.filter(h=>marcado(fe,h.id)).length;
    csv+=fe+','+DIAS_L()[dd.getDay()]+','+cols.join(',')+','+ok+','+hs.length+','+(hs.length?Math.round(ok/hs.length*100):'')+'\n';});
  csv+='\nTareas\nTarea,Categoria,Prioridad,Fecha,Estado\n';
  D.tareas.forEach(x=>{csv+='"'+x.nom.replace(/"/g,'""')+'",'+x.cat+','+x.pri+','+(x.fecha||'')+','+(x.hecho?'1':'0')+'\n';});
  csv+='\nMovimientos\nFecha,Tipo,Categoria,Concepto,Monto\n';
  D.movs.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(m=>{
    csv+=m.fecha+','+m.tipo+','+m.cat+',"'+(m.desc||'').replace(/"/g,'""')+'",'+m.monto+'\n';});
  csv+='\nMetas\nMeta,Objetivo,Ahorrado,Porcentaje\n';
  D.metas.forEach(g=>{const a=ahorradoEn(g.id);
    csv+='"'+g.nom.replace(/"/g,'""')+'",'+g.obj+','+a+','+(g.obj?Math.round(a/g.obj*100):0)+'\n';});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='agenda-'+hoyIso()+'.csv';a.click();
}

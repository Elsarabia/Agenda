<style>
  :root{
    --paper:#E7EAED; --card:#FFFFFF;
    --ink:#16202A; --ink-2:#5D6B77; --ink-3:#98A4AE;
    --line:#D3D9DE; --linea-suave:#EDF0F2;
    --th:#F4F6F7; --sutil:#F7F9FA; --tag:#EFF2F4; --fill:#E3E7EA;
    --jade:#17705A; --jade-fuerte:#0E4A3C; --jade-soft:#D9E8E3;
    --amber:#A9750B; --amber-soft:#F6EAD2;
    --rust:#9A3B39; --rust-soft:#F3DEDD;
    --h0:#F1F4F5; --h1:#DCE9E4; --h2:#A9CCC0; --h3:#4E9682; --h4:#17705A;
    --h2-txt:#0E4A3C;
    --shadow:0 1px 0 rgba(22,32,42,.06);
    --r:5px;
  }
  html[data-tema="oscuro"]{
    --paper:#11171C; --card:#1A2229;
    --ink:#E9EEF2; --ink-2:#9BA9B4; --ink-3:#6B7B88;
    --line:#2B353D; --linea-suave:#232C34;
    --th:#212A32; --sutil:#1F272E; --tag:#242E36; --fill:#2B353D;
    --jade:#4FA98B; --jade-fuerte:#7BC7AB; --jade-soft:#1D3A32;
    --amber:#D9A03C; --amber-soft:#3A2F18;
    --rust:#D97B76; --rust-soft:#3B2422;
    --h0:#212A32; --h1:#22443A; --h2:#2F6B58; --h3:#3E8E75; --h4:#4FA98B;
    --h2-txt:#CDE8DE;
    --shadow:none;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:Inter,system-ui,-apple-system,sans-serif;
    font-size:15px; line-height:1.5; padding-bottom:88px;
    transition:background .2s ease,color .2s ease;
  }
  h1,h2,h3,.num{font-family:'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}

  header{padding:18px 0 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .fecha{font-family:'Space Grotesk';font-size:19px;font-weight:600;letter-spacing:-.2px}
  .fecha span{display:block;font-family:Inter;font-size:12.5px;font-weight:400;color:var(--ink-2);letter-spacing:0}

  /* relojes */
  .relojes{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:18px;position:relative;margin-top:16px}
  .analogo{width:104px;height:104px;min-width:104px}
  .analogo circle.cara{fill:var(--sutil);stroke:var(--line);stroke-width:1.5}
  .analogo line.tick{stroke:var(--ink-3);stroke-width:1.2}
  .analogo line.tick.g{stroke:var(--ink-2);stroke-width:2.4}
  .analogo line.h{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
  .analogo line.m{stroke:var(--ink);stroke-width:2.8;stroke-linecap:round}
  .analogo line.s{stroke:var(--jade);stroke-width:1.4;stroke-linecap:round}
  .analogo circle.eje{fill:var(--ink)}
  .digital{flex:1;min-width:0}
  .hora{font-family:'Space Grotesk';font-size:38px;font-weight:700;letter-spacing:-2.2px;line-height:1;font-variant-numeric:tabular-nums}
  .hora i{font-style:normal;font-size:18px;font-weight:500;color:var(--ink-3);letter-spacing:-.5px;margin-left:3px}
  .hora em{font-style:normal;font-size:14px;font-weight:500;color:var(--ink-2);margin-left:5px}
  .dia-largo{font-size:13.5px;color:var(--ink-2);margin-top:7px;line-height:1.35}
  .dia-largo b{display:block;color:var(--ink);font-weight:600;font-size:14.5px}
  .racha-linea{margin-top:10px;padding-top:10px;border-top:1px solid var(--linea-suave);font-size:12.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
  .racha-linea b{font-family:'Space Grotesk';color:var(--ink);font-weight:600}
  .tema-btn{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
  .tema-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  @media (max-width:350px){ .relojes{gap:12px} .analogo{width:86px;height:86px;min-width:86px} .hora{font-size:31px} }

  /* medidor */
  .medidor{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
  .medidor-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .pct{font-family:'Space Grotesk';font-size:44px;font-weight:700;letter-spacing:-2px;line-height:1}
  .pct small{font-size:20px;font-weight:500;letter-spacing:-1px;color:var(--ink-2)}
  .medidor-lab{font-size:12.5px;color:var(--ink-2);text-align:right;max-width:44%}
  .segs{display:flex;gap:3px;height:26px}
  .seg{flex:1;background:var(--fill);border-radius:1px;transition:background .25s ease}
  .seg.on{background:var(--jade)}
  .seg.on.parcial{background:var(--h3)}
  .medidor-pie{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--ink-2)}

  /* nav */
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  .nav-in{max-width:760px;margin:0 auto;display:flex}
  nav button{flex:1;padding:11px 2px 13px;font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:500}
  nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  nav button.act{color:var(--jade)}

  section{display:none;padding-top:4px}
  section.act{display:block}
  .tit{font-size:12.5px;color:var(--ink-2);margin:22px 0 9px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .tit b{font-weight:600;color:var(--ink);font-size:15px;font-family:'Space Grotesk'}

  /* listas */
  .lista{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
  .fila{display:flex;gap:12px;padding:13px 14px;border-bottom:1px solid var(--linea-suave);align-items:flex-start}
  .fila:last-child{border-bottom:none}
  .check{width:23px;height:23px;min-width:23px;border:1.8px solid var(--ink-3);border-radius:50%;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:.15s}
  .check.cuadro{border-radius:4px}
  .check svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
  .check.on{background:var(--jade);border-color:var(--jade)}
  .check.on svg{opacity:1}
  .cuerpo{flex:1;min-width:0}
  .nom{font-weight:500;line-height:1.35}
  .fila.hecho .nom{color:var(--ink-3);text-decoration:line-through}
  .desc{font-size:12.8px;color:var(--ink-2);margin-top:3px;line-height:1.42}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
  .tag{font-size:11.5px;color:var(--ink-2);background:var(--tag);padding:2px 7px;border-radius:3px;font-weight:500}
  .tag.jade{background:var(--jade-soft);color:var(--jade)}
  .tag.amber{background:var(--amber-soft);color:var(--amber)}
  .tag.rust{background:var(--rust-soft);color:var(--rust)}
  .mini{font-family:'Space Grotesk';font-size:12px;color:var(--ink-2);white-space:nowrap;text-align:right;padding-top:2px}
  .mini b{display:block;font-size:16px;color:var(--ink);font-weight:600}
  .borrar{color:var(--ink-3);font-size:18px;line-height:1;padding:2px 4px}
  .vacio{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--ink-2);font-size:13.5px}

  /* botones */
  .btn{background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:var(--r);font-weight:500;font-size:14.5px;width:100%;text-align:center}
  .btn.ghost{background:none;color:var(--jade);border:1px solid var(--line);font-weight:600}
  .btn.chico{width:auto;padding:7px 12px;font-size:13px}
  .filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;scrollbar-width:none}
  .filtros::-webkit-scrollbar{display:none}
  .filtros button{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:20px;font-size:13px;color:var(--ink-2);white-space:nowrap}
  .filtros button.act{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* calendario */
  .cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
  .cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-top b{font-family:'Space Grotesk';font-size:16px;font-weight:600}
  .cal-top button{font-size:20px;color:var(--ink-2);padding:2px 10px}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
  .dow div{text-align:center;font-size:11px;color:var(--ink-3);font-weight:500}
  .dias{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dia{aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-size:12.5px;background:var(--h0);color:var(--ink-2);border:1px solid transparent}
  .dia.n0{background:var(--h0)}
  .dia.n1{background:var(--h1);color:var(--jade)}
  .dia.n2{background:var(--h2);color:var(--h2-txt)}
  .dia.n3{background:var(--h3);color:#fff}
  .dia.n4{background:var(--h4);color:#fff;font-weight:600}
  .dia.hoy{border-color:var(--ink);font-weight:700}
  .dia.fuera{opacity:.32}
  .dia.futuro{background:transparent;border:1px dashed var(--line);color:var(--ink-3)}
  .leyenda{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11.5px;color:var(--ink-2)}
  .leyenda i{width:15px;height:15px;border-radius:3px;display:inline-block}

  /* dinero */
  .saldo{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
  .saldo-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
  .saldo-num{font-family:'Space Grotesk';font-size:36px;font-weight:700;letter-spacing:-1.6px;line-height:1}
  .saldo-num.rojo{color:var(--rust)}
  .saldo-lab{font-size:12.5px;color:var(--ink-2);margin-top:4px}
  .mes-nav{display:flex;align-items:center;gap:4px;font-family:'Space Grotesk';font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
  .mes-nav button{padding:2px 8px;font-size:17px;color:var(--ink-3)}
  .flujo{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--fill)}
  .flujo i{display:block;height:100%}
  .flujo-lab{display:flex;justify-content:space-between;margin-top:9px;font-size:12.5px;gap:6px}
  .flujo-lab span{display:flex;align-items:center;gap:5px;color:var(--ink-2)}
  .flujo-lab b{font-family:'Space Grotesk';color:var(--ink);font-weight:600}
  .punto{width:8px;height:8px;border-radius:2px;display:inline-block}
  .meta-c{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
  .meta-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .meta-cifra{font-family:'Space Grotesk';font-size:13px;color:var(--ink-2);white-space:nowrap;text-align:right}
  .meta-cifra b{display:block;font-size:17px;color:var(--ink);font-weight:700}
  .meta-barra{height:8px;background:var(--fill);border-radius:4px;margin:11px 0 9px;overflow:hidden}
  .meta-barra i{display:block;height:100%;background:var(--jade);border-radius:4px;transition:width .3s ease}
  .meta-pie{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
  .monto{font-family:'Space Grotesk';font-weight:600;font-size:15px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
  .monto.ing{color:var(--jade)}
  .monto.gas{color:var(--rust)}
  .monto.aho{color:var(--ink-2)}
  .tipo-sel{display:flex;gap:6px}
  .tipo-sel button{flex:1;padding:11px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font-size:13.5px;color:var(--ink-2)}
  .tipo-sel button.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}

  /* estadísticas */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;box-shadow:var(--shadow)}
  .kpi b{display:block;font-family:'Space Grotesk';font-size:26px;font-weight:700;letter-spacing:-1px;line-height:1.15}
  .kpi span{font-size:12px;color:var(--ink-2)}
  .barras{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
  .barras-g{display:flex;gap:4px;align-items:flex-end;height:104px}
  .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
  .col i{display:block;background:var(--jade);border-radius:1px;min-height:2px}
  .col.vacia i{background:var(--fill)}
  .col.hoy-col i{background:var(--jade-fuerte)}
  .ejes{display:flex;gap:4px;margin-top:6px}
  .ejes div{flex:1;text-align:center;font-size:9.5px;color:var(--ink-3);font-family:'Space Grotesk'}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
  th{text-align:left;font-size:11.5px;color:var(--ink-2);font-weight:600;padding:9px 10px;background:var(--th);border-bottom:1px solid var(--line)}
  th.r,td.r{text-align:right}
  td{padding:10px;border-bottom:1px solid var(--linea-suave);font-size:13.5px}
  tr:last-child td{border-bottom:none}
  td.n{font-family:'Space Grotesk';font-weight:600;font-variant-numeric:tabular-nums}
  .barrita{height:5px;background:var(--fill);border-radius:3px;margin-top:5px;overflow:hidden}
  .barrita i{display:block;height:100%;background:var(--jade)}
  .periodo-sel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;box-shadow:var(--shadow);margin:16px 0 14px}
  .periodo-sel .filtros{margin-bottom:10px}
  .periodo-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .periodo-nav b{font-family:'Space Grotesk';font-size:15px;font-weight:600;text-align:center;flex:1;line-height:1.25}
  .periodo-nav button{padding:3px 12px;font-size:20px;color:var(--ink-2)}
  .periodo-nav button[disabled]{opacity:.3}
  .acc-dia{display:flex;gap:8px;margin-top:9px}
  .acc-dia .btn{flex:1;font-size:13px;padding:9px 6px}

  /* ajustes */
  .ajuste{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
  .ajuste .nom{margin-bottom:9px}
  .opciones{display:flex;gap:6px}
  .opciones button{flex:1;padding:9px 4px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);font-size:13px;color:var(--ink-2)}
  .opciones button.on{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:600}

  /* formulario */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.46);z-index:60;display:none;align-items:flex-end;justify-content:center}
  .modal.act{display:flex}
  .hoja{background:var(--paper);width:100%;max-width:760px;border-radius:14px 14px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
  .hoja h3{margin:0 0 14px;font-size:18px;font-weight:600}
  label{display:block;font-size:12.5px;color:var(--ink-2);margin:12px 0 5px}
  .campo{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
  textarea.campo{min-height:66px;resize:vertical;line-height:1.45}
  .dias-sem{display:flex;gap:5px}
  .dias-sem button{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font-size:12.5px;color:var(--ink-2)}
  .dias-sem button.on{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:600}
  .par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .acciones{display:flex;gap:9px;margin-top:20px}
  .acciones .btn{flex:1}
  @media (min-width:620px){ .kpis{grid-template-columns:repeat(4,1fr)} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ==================== capa premium ==================== */
:root{
  --glass:rgba(255,255,255,.60);
  --glass-borde:rgba(255,255,255,.80);
  --glass-sombra:0 10px 34px rgba(16,32,42,.10);
  --halo-a:rgba(23,112,90,.16);
  --halo-b:rgba(90,150,200,.14);
  --halo-c:rgba(200,170,110,.12);
}
html[data-tema="oscuro"]{
  --glass:rgba(30,40,49,.52);
  --glass-borde:rgba(255,255,255,.10);
  --glass-sombra:0 10px 34px rgba(0,0,0,.42);
  --halo-a:rgba(79,169,139,.20);
  --halo-b:rgba(70,110,160,.18);
  --halo-c:rgba(150,120,70,.12);
}
body{
  font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;
  background:var(--paper);
  background-image:
    radial-gradient(58vw 44vh at 8% -6%, var(--halo-a), transparent 68%),
    radial-gradient(52vw 40vh at 102% 4%, var(--halo-b), transparent 66%),
    radial-gradient(46vw 34vh at 50% 108%, var(--halo-c), transparent 70%);
  background-attachment:fixed;
}
h1,h2,h3,.tit b,.hoja h3{font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto;letter-spacing:-.01em}
.tit b{font-size:16.5px;font-weight:600}
.pct,.hora,.kpi b,.saldo-num,.mini b,.meta-cifra b,td.n,.num,.dia,.ejes div,.fecha{font-family:'Space Grotesk',sans-serif}

/* cristal — solo en superficies grandes, para no cargar el render */
.relojes,.medidor,.saldo,.periodo-sel,.cal,nav,.hoja,.auth-card{
  background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--glass-borde);
  box-shadow:var(--glass-sombra);
}
.relojes,.medidor,.saldo,.periodo-sel,.cal{border-radius:16px}
.lista,.meta-c,.kpi,.barras,table,.ajuste,.vacio{border-radius:14px}
.lista,.meta-c,.kpi,.barras,table,.ajuste{
  background:color-mix(in srgb,var(--card) 88%,transparent);
  border-color:var(--glass-borde);
}
.hoja{border-radius:22px 22px 0 0}
.btn,.campo,.filtros button,.opciones button,.tipo-sel button,.dias-sem button{border-radius:11px}
.btn{transition:transform .12s ease,opacity .12s ease}
.btn:active{transform:scale(.97);opacity:.9}
nav{background:color-mix(in srgb,var(--paper) 72%,transparent)}

/* animaciones */
@keyframes surgir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes brotar{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes entrarApp{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes desvanecer{to{opacity:0;transform:scale(1.04);visibility:hidden}}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
section.act{animation:surgir .3s cubic-bezier(.22,.9,.3,1) both}
.check.on svg{animation:brotar .28s cubic-bezier(.3,1.4,.5,1) both}
.check{transition:background .18s ease,border-color .18s ease,transform .12s ease}
.check:active{transform:scale(.88)}
.fila{transition:background .15s ease}
.seg{transition:background .3s cubic-bezier(.4,0,.2,1)}
.meta-barra i,.barrita i,.col i{transition:width .45s cubic-bezier(.3,.9,.3,1),height .45s cubic-bezier(.3,.9,.3,1)}
nav button svg{transition:transform .2s ease}
nav button.act svg{transform:translateY(-2px) scale(1.06)}
.wrap{animation:entrarApp .45s ease both}

/* pantalla de acceso */
.auth{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:22px;
  background:var(--paper);
  background-image:
    radial-gradient(70vw 50vh at 12% -8%, var(--halo-a), transparent 66%),
    radial-gradient(64vw 46vh at 96% 6%, var(--halo-b), transparent 64%),
    radial-gradient(56vw 40vh at 50% 106%, var(--halo-c), transparent 68%);}
.auth.fuera{animation:desvanecer .45s ease both;pointer-events:none}
#particulas{position:absolute;inset:0;width:100%;height:100%}
.auth-card{position:relative;width:100%;max-width:380px;padding:30px 24px 24px;border-radius:22px;animation:surgir .55s cubic-bezier(.22,.9,.3,1) both}
.auth-marca{font-family:'Fraunces',serif;font-size:36px;font-weight:600;letter-spacing:-1px;line-height:1;animation:flotar 5s ease-in-out infinite}
.auth-sub{color:var(--ink-2);font-size:13.5px;margin:9px 0 22px;line-height:1.45}
.auth .campo{background:color-mix(in srgb,var(--card) 70%,transparent);margin-bottom:9px}
.auth .acc-dia{margin-top:14px}
.auth-link{display:block;width:100%;text-align:center;margin-top:16px;font-size:13px;color:var(--ink-2);padding:8px}
.auth-idioma{position:absolute;top:14px;right:14px;font-size:12px;color:var(--ink-2);padding:5px 10px;border:1px solid var(--glass-borde);border-radius:20px}
.auth-msg{font-size:12.5px;color:var(--rust);margin-top:10px;min-height:16px;line-height:1.4}

@media (prefers-reduced-motion:reduce){
  section.act,.check.on svg,.wrap,.auth-card,.auth-marca{animation:none!important}
}

/* ==================== mejoras ==================== */
.frase{margin-top:12px;padding:13px 15px;border-radius:14px;
  background:color-mix(in srgb,var(--card) 82%,transparent);
  border:1px solid var(--glass-borde);
  font-family:'Fraunces',Georgia,serif;font-size:15.5px;line-height:1.42;font-style:italic;
  animation:surgir .5s ease both}
.frase span{display:block;font-family:'Space Grotesk',sans-serif;font-style:normal;
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.nota-caja{padding:12px 14px;border-top:1px solid var(--linea-suave)}
.nota-caja textarea{width:100%;min-height:62px;padding:10px 11px;border:1px solid var(--line);
  border-radius:11px;background:var(--paper);resize:vertical;line-height:1.45;font-size:14px}
.ano-caja{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.ano-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,10px);gap:3px;width:max-content}
.ano-grid i{width:10px;height:10px;border-radius:2px;background:var(--h0);display:block}
.ano-grid i.n1{background:var(--h1)}.ano-grid i.n2{background:var(--h2)}
.ano-grid i.n3{background:var(--h3)}.ano-grid i.n4{background:var(--h4)}
.ano-grid i.vacio{background:transparent}
.ano-meses{display:flex;gap:3px;width:max-content;margin-bottom:5px;font-size:9.5px;color:var(--ink-3)}
.pres-fila{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.pres-fila label{margin:0;flex:1;font-size:14px;color:var(--ink)}
.pres-fila input{width:112px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:right}
.barrita i.amarilla{background:var(--amber)}
.barrita i.roja{background:var(--rust)}
.tuto{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:22px;
  background:color-mix(in srgb,var(--paper) 90%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tuto.act{display:flex}
.tuto-card{width:100%;max-width:400px;padding:26px 22px 20px;border-radius:22px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--glass-borde);box-shadow:var(--glass-sombra)}
.tuto-paso{font-family:'Space Grotesk';font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--jade);margin-bottom:10px}
.tuto-card h3{font-family:'Fraunces',serif;font-size:25px;font-weight:600;margin:0 0 10px;line-height:1.15;letter-spacing:-.5px}
.tuto-card p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.55;min-height:132px;animation:surgir .3s ease both}
.tuto-puntos{display:flex;gap:6px;justify-content:center;margin:18px 0 14px}
.tuto-puntos i{width:6px;height:6px;border-radius:50%;background:var(--fill);transition:.25s}
.tuto-puntos i.on{background:var(--jade);width:20px;border-radius:3px}

/* ==================== paletas ==================== */
html[data-color="jade"]{--jade:#17705A;--jade-fuerte:#0E4A3C;--jade-soft:#D9E8E3;--h1:#DCE9E4;--h2:#A9CCC0;--h3:#4E9682;--h4:#17705A;--h2-txt:#0E4A3C;--halo-a:rgba(23,112,90,.18)}
html[data-color="indigo"]{--jade:#4A45C7;--jade-fuerte:#2E2A8E;--jade-soft:#E1E0F8;--h1:#E4E3F9;--h2:#B3B1EC;--h3:#7773D8;--h4:#4A45C7;--h2-txt:#2E2A8E;--halo-a:rgba(74,69,199,.18)}
html[data-color="magenta"]{--jade:#B5297F;--jade-fuerte:#7E1A58;--jade-soft:#FADCEE;--h1:#FBE0F0;--h2:#EFAED4;--h3:#D163A3;--h4:#B5297F;--h2-txt:#7E1A58;--halo-a:rgba(181,41,127,.18)}
html[data-color="ambar"]{--jade:#B26A05;--jade-fuerte:#7C4903;--jade-soft:#FCEAD0;--h1:#FDEED8;--h2:#F3C88A;--h3:#D79A3C;--h4:#B26A05;--h2-txt:#7C4903;--halo-a:rgba(178,106,5,.18)}
html[data-color="coral"]{--jade:#C4392F;--jade-fuerte:#8C2721;--jade-soft:#FBDEDB;--h1:#FCE2DF;--h2:#F2B0A8;--h3:#DC6E62;--h4:#C4392F;--h2-txt:#8C2721;--halo-a:rgba(196,57,47,.18)}
html[data-color="turquesa"]{--jade:#0A7C8C;--jade-fuerte:#065460;--jade-soft:#D3EDF1;--h1:#D8EFF3;--h2:#9AD3DC;--h3:#3F9FAE;--h4:#0A7C8C;--h2-txt:#065460;--halo-a:rgba(10,124,140,.18)}
html[data-tema="oscuro"][data-color="jade"]{--jade:#4FA98B;--jade-fuerte:#7BC7AB;--jade-soft:#1D3A32;--h1:#22443A;--h2:#2F6B58;--h3:#3E8E75;--h4:#4FA98B;--h2-txt:#CDE8DE;--halo-a:rgba(79,169,139,.18)}
html[data-tema="oscuro"][data-color="indigo"]{--jade:#8B87F0;--jade-fuerte:#ADAAF7;--jade-soft:#262463;--h1:#2A2870;--h2:#4441A8;--h3:#6B67CE;--h4:#8B87F0;--h2-txt:#DEDDFB;--halo-a:rgba(139,135,240,.18)}
html[data-tema="oscuro"][data-color="magenta"]{--jade:#EC77BE;--jade-fuerte:#F5A5D6;--jade-soft:#4A1435;--h1:#55173C;--h2:#8A2C66;--h3:#BE4E90;--h4:#EC77BE;--h2-txt:#FBDCEF;--halo-a:rgba(236,119,190,.18)}
html[data-tema="oscuro"][data-color="ambar"]{--jade:#E5A73F;--jade-fuerte:#F3C877;--jade-soft:#4A3208;--h1:#543A0A;--h2:#8A6113;--h3:#B98828;--h4:#E5A73F;--h2-txt:#FBE9C8;--halo-a:rgba(229,167,63,.18)}
html[data-tema="oscuro"][data-color="coral"]{--jade:#F0847A;--jade-fuerte:#F7ABA4;--jade-soft:#4C1F1B;--h1:#57231E;--h2:#8C3D35;--h3:#BE5B51;--h4:#F0847A;--h2-txt:#FBDFDC;--halo-a:rgba(240,132,122,.18)}
html[data-tema="oscuro"][data-color="turquesa"]{--jade:#4FBCCE;--jade-fuerte:#82D5E2;--jade-soft:#10383F;--h1:#143F47;--h2:#256B78;--h3:#3691A2;--h4:#4FBCCE;--h2-txt:#CFEDF3;--halo-a:rgba(79,188,206,.18)}

.colores{display:flex;gap:10px;flex-wrap:wrap}
.colores button{width:36px;height:36px;border-radius:50%;padding:0;border:2px solid transparent;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .15s ease,border-color .15s ease}
.colores button.on{border-color:var(--ink);transform:scale(1.08)}
.colores button:active{transform:scale(.92)}

/* ==================== portada ==================== */
.aurora{position:absolute;inset:-25%;pointer-events:none;overflow:hidden}
.aurora b{position:absolute;display:block;width:62vmax;height:62vmax;border-radius:50%;
  will-change:transform;animation:deriva 26s ease-in-out infinite alternate}
.aurora b:nth-child(1){top:-22%;left:-18%;background:radial-gradient(circle at 50% 50%,rgba(23,112,90,.72),transparent 64%);animation-duration:24s}
.aurora b:nth-child(2){top:-10%;right:-24%;background:radial-gradient(circle at 50% 50%,rgba(74,69,199,.60),transparent 64%);animation-duration:31s;animation-delay:-6s}
.aurora b:nth-child(3){bottom:-28%;left:-10%;background:radial-gradient(circle at 50% 50%,rgba(181,41,127,.52),transparent 64%);animation-duration:28s;animation-delay:-12s}
.aurora b:nth-child(4){bottom:-20%;right:-18%;background:radial-gradient(circle at 50% 50%,rgba(229,167,63,.50),transparent 64%);animation-duration:35s;animation-delay:-3s}
html[data-tema="oscuro"] .aurora b:nth-child(1){background:radial-gradient(circle at 50% 50%,rgba(79,169,139,.58),transparent 64%)}
html[data-tema="oscuro"] .aurora b:nth-child(2){background:radial-gradient(circle at 50% 50%,rgba(139,135,240,.52),transparent 64%)}
html[data-tema="oscuro"] .aurora b:nth-child(3){background:radial-gradient(circle at 50% 50%,rgba(236,119,190,.44),transparent 64%)}
html[data-tema="oscuro"] .aurora b:nth-child(4){background:radial-gradient(circle at 50% 50%,rgba(229,167,63,.38),transparent 64%)}
@keyframes deriva{
  0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(6%,-7%,0) scale(1.14)}
  100%{transform:translate3d(-5%,6%,0) scale(.94)}
}
.auth{background-image:none}
.auth-card{overflow:hidden}
.auth-card::after{content:'';position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:skewX(-18deg);animation:brillo 5.5s ease-in-out infinite;pointer-events:none}
@keyframes brillo{0%,62%{left:-60%}88%,100%{left:130%}}
.auth-marca{
  background:linear-gradient(96deg,#17705A 0%,#0A7C8C 26%,#4A45C7 56%,#B5297F 82%,#C4392F 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  background-size:220% 100%;animation:flotar 5s ease-in-out infinite, tornasol 11s ease-in-out infinite}
html[data-tema="oscuro"] .auth-marca{
  background:linear-gradient(96deg,#5FD1AE 0%,#4FBCCE 26%,#8B87F0 56%,#EC77BE 82%,#F0847A 100%);
  -webkit-background-clip:text;background-clip:text;background-size:220% 100%}
@keyframes tornasol{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.auth-marca-pie{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
@media (prefers-reduced-motion:reduce){
  .aurora b,.auth-marca,.auth-card::after{animation:none!important}
}

/* ==================== ambiente dentro de la app ==================== */
:root{--grad:linear-gradient(100deg,var(--h3) 0%,var(--jade) 52%,var(--jade-fuerte) 100%)}
.fondo-app{position:fixed;inset:-25%;z-index:-2;pointer-events:none;overflow:hidden}
#particulasApp{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none;opacity:.6}
html[data-fondo="suave"] #particulasApp{display:none}
html[data-fondo="apagado"] #particulasApp{display:none}
html[data-fondo="apagado"] .fondo-app{display:none}
html[data-fondo="suave"] .fondo-app b{animation-duration:70s!important}
.fondo-app b{opacity:.52}
html[data-tema="oscuro"] .fondo-app b{opacity:.42}
body.oculto .fondo-app b,body.oculto #particulasApp{animation-play-state:paused}

/* texto con degradado */
.grad-txt,.tit b,.pct,.saldo-num,.kpi b,.marca-app{
  background:var(--grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent}
.pct small{-webkit-text-fill-color:var(--ink-2)}
.saldo-num.rojo{background:none;-webkit-text-fill-color:var(--rust);color:var(--rust)}
.tit span{-webkit-text-fill-color:var(--ink-2)}

/* encabezado de marca */
.marca-barra{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:16px 2px 2px}
.marca-app{font-family:'Fraunces',Georgia,serif;font-size:27px;font-weight:600;letter-spacing:-.7px;line-height:1}
.marca-pie{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}

/* más cristal, menos sólido */
.lista,.meta-c,.kpi,.barras,table,.ajuste,.vacio,.frase{
  background:color-mix(in srgb,var(--card) 62%,transparent);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid var(--glass-borde)}
.fila{border-bottom-color:color-mix(in srgb,var(--linea-suave) 60%,transparent)}
th{background:color-mix(in srgb,var(--th) 55%,transparent)}
.relojes,.medidor,.saldo,.periodo-sel,.cal{background:color-mix(in srgb,var(--card) 46%,transparent)}
.campo,.filtros button,.opciones button,.tipo-sel button,.dias-sem button{
  background:color-mix(in srgb,var(--card) 70%,transparent)}

/* acentos de color en controles */
.btn:not(.ghost){background:var(--grad);color:#fff;border:none}
.check.on{background:var(--grad);border-color:transparent}
.seg.on{background:var(--grad)}
.seg.on.parcial{background:var(--h2)}
.meta-barra i,.barrita i:not(.amarilla):not(.roja),.col i:not(.vacia){background:var(--grad)}
.col.vacia i{background:color-mix(in srgb,var(--fill) 70%,transparent)}
.dia.n4{background:var(--grad)}
.dia.hoy{border-color:var(--jade);box-shadow:0 0 0 1px var(--jade)}
.filtros button.act,.opciones button.on,.tipo-sel button.on,.dias-sem button.on{
  background:var(--grad);border-color:transparent;color:#fff}
.filtros button.act{color:#fff}
nav button.act{color:var(--jade)}
.tag.jade{background:color-mix(in srgb,var(--jade-soft) 80%,transparent)}
.ano-grid i.n4{background:var(--grad)}

@media (prefers-reduced-motion:reduce){ .fondo-app b{animation:none!important} }

/* ==================== racha ==================== */
.racha-card{margin-top:12px;padding:16px;border-radius:16px;
  background:color-mix(in srgb,var(--card) 46%,transparent);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--glass-borde);box-shadow:var(--glass-sombra);animation:surgir .45s ease both}
.racha-top{display:flex;align-items:flex-end;gap:14px}
.racha-num{font-family:'Space Grotesk';font-size:58px;font-weight:700;line-height:.9;letter-spacing:-3px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.racha-lado{flex:1;padding-bottom:5px}
.racha-lado .g{font-size:13.5px;color:var(--ink-2);line-height:1.3}
.racha-lado .r{font-family:'Space Grotesk';font-size:12px;color:var(--ink-3);margin-top:3px}
.racha-hito{margin-top:14px}
.racha-hito .l{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.racha-hito .l b{font-family:'Space Grotesk';color:var(--ink)}
.racha-barra{height:7px;border-radius:4px;background:var(--fill);overflow:hidden}
.racha-barra i{display:block;height:100%;background:var(--grad);border-radius:4px;transition:width .5s cubic-bezier(.3,.9,.3,1)}
.racha-aviso{margin-top:13px;padding:11px 13px;border-radius:12px;font-size:13px;line-height:1.4;
  background:color-mix(in srgb,var(--amber-soft) 70%,transparent);color:var(--amber)}
.racha-aviso.ok{background:color-mix(in srgb,var(--jade-soft) 70%,transparent);color:var(--jade)}
.racha-aviso button{display:block;width:100%;margin-top:9px;padding:9px;border-radius:10px;
  background:var(--grad);color:#fff;font-weight:600;font-size:13px}
.dia.congelado{border:1px dashed var(--amber);color:var(--amber)}
.plantilla{padding:13px 14px;border-bottom:1px solid var(--linea-suave);display:flex;gap:12px;align-items:center}
.plantilla:last-child{border-bottom:none}
.plantilla .cuerpo{flex:1}
.orden-btns{display:flex;flex-direction:column;gap:3px}
.orden-btns button{width:26px;height:22px;border:1px solid var(--line);border-radius:6px;
  font-size:11px;color:var(--ink-2);line-height:1;display:flex;align-items:center;justify-content:center}

.btn-icono{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--card) 60%,transparent);border:1px solid var(--glass-borde);color:var(--ink-2)}
.btn-icono svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.reloj-enfoque{font-family:'Space Grotesk';font-size:64px;font-weight:700;letter-spacing:-3px;text-align:center;
  margin:10px 0 6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.enfoque-sub{text-align:center;color:var(--ink-2);font-size:13.5px;margin-bottom:16px}
.aro{display:block;margin:0 auto}
.aro circle{fill:none;stroke-width:6;stroke-linecap:round}
.aro .base{stroke:var(--fill)}
.aro .prog{stroke:var(--jade);transition:stroke-dashoffset 1s linear}
.toast{position:fixed;left:14px;right:14px;bottom:96px;z-index:80;padding:14px 16px;border-radius:14px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid var(--glass-borde);box-shadow:var(--glass-sombra);animation:surgir .3s ease both;max-width:730px;margin:0 auto}
.toast b{display:block;font-family:'Fraunces',serif;font-size:16px;margin-bottom:2px}
.pres-item{display:flex;gap:12px;padding:13px 14px;border-bottom:1px solid var(--linea-suave);align-items:flex-start}
.pres-item:last-child{border-bottom:none}
.pres-item.cerrado .nom{color:var(--ink-3);text-decoration:line-through}

.hallazgo{padding:14px;border-bottom:1px solid var(--linea-suave)}
.hallazgo:last-child{border-bottom:none}
.hallazgo b{font-family:'Fraunces',serif;font-size:16px;display:block;margin-bottom:4px}
.hallazgo .cifra{font-family:'Space Grotesk';font-weight:700;font-size:19px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.fila.pausada{opacity:.55}
.posponer{color:var(--ink-3);font-size:15px;padding:2px 5px;line-height:1}

/* ==================== ajustes de interfaz ==================== */
body{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15.5px}
h1,h2,h3,.tit b,.hoja h3,.auth-marca,.marca-app,.hallazgo b,.tuto-card h3{font-family:'Fraunces',Georgia,serif}
.pct,.hora,.kpi b,.saldo-num,.mini b,.meta-cifra b,td.n,.num,.dia,.ejes div,.fecha,
.racha-num,.reloj-enfoque,.monto,.periodo-nav b,.cal-top b,.mes-nav,.racha-lado .r,
.dow div,.tag,.filtros button,.hallazgo .cifra{font-family:'Space Grotesk',sans-serif}

/* el degradado se reserva para lo que de verdad importa */
.tit b,.kpi b,.hallazgo .cifra{background:none;-webkit-text-fill-color:var(--ink);color:var(--ink)}
.hallazgo .cifra{-webkit-text-fill-color:var(--jade);color:var(--jade)}
.marca-app,.pct,.saldo-num,.racha-num,.auth-marca,.reloj-enfoque{
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.saldo-num.rojo{-webkit-text-fill-color:var(--rust)}

/* legibilidad sobre el cristal */
.lista,.meta-c,.kpi,.barras,table,.ajuste,.vacio,.frase{
  background:color-mix(in srgb,var(--card) 84%,transparent)}
.relojes,.medidor,.saldo,.periodo-sel,.cal,.racha-card{
  background:color-mix(in srgb,var(--card) 72%,transparent)}
.desc,.medidor-pie,.meta-pie,.racha-lado .g{font-size:13.4px;color:var(--ink-2)}
html[data-tema="oscuro"] .desc{color:#A8B6C1}
.tag{font-size:12px}

/* tamaño de letra */
html[data-letra="chico"] body{font-size:14.5px}
html[data-letra="grande"] body{font-size:17px}
html[data-letra="grande"] .desc{font-size:14.6px}
html[data-letra="grande"] .tag{font-size:13px}

/* áreas de toque de 44px */
.orden-btns{gap:0}
.orden-btns button{width:44px;height:34px;font-size:12px;border:none;background:none;color:var(--ink-3)}
.borrar,.posponer{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:19px}
.tema-btn{width:44px;height:44px;top:4px;right:4px}
.cal-top button,.periodo-nav button,.mes-nav button{min-width:44px;min-height:40px}
.auth-link{padding:12px}

/* respuesta al tacto */
.fila,.plantilla,.pres-item{transition:background .12s ease}
.fila:active,.plantilla:active,.pres-item:active{background:color-mix(in srgb,var(--jade-soft) 45%,transparent)}
.dia{transition:transform .12s ease}
.dia:active{transform:scale(.88)}
.kpi{transition:transform .12s ease}

/* sub-pestañas */
.subnav{position:sticky;top:0;z-index:20;padding:10px 0 8px;margin:0 0 4px;
  background:color-mix(in srgb,var(--paper) 82%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.sub{display:none}
.sub.act{display:block;animation:surgir .24s ease both}

/* hojas modales que deslizan */
.modal{opacity:0;transition:opacity .22s ease}
.modal.act{opacity:1}
.hoja{transform:translateY(100%);transition:transform .3s cubic-bezier(.22,.9,.3,1)}
.modal.act .hoja{transform:none}
.hoja::before{content:'';display:block;width:42px;height:4px;border-radius:3px;
  background:var(--ink-3);opacity:.35;margin:-6px auto 14px}

/* estados vacíos */
.vacio{padding:30px 20px}
.vacio svg{width:34px;height:34px;stroke:var(--ink-3);fill:none;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round;opacity:.5;margin-bottom:10px}

/* esqueleto de carga */
.esqueleto{padding:16px}
.esqueleto i{display:block;height:14px;border-radius:7px;margin-bottom:10px;
  background:linear-gradient(90deg,var(--fill),color-mix(in srgb,var(--fill) 40%,transparent),var(--fill));
  background-size:200% 100%;animation:latir 1.3s ease-in-out infinite}
@keyframes latir{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* punto de tareas en el calendario */
.dia{position:relative}
.dia .pt{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--amber)}
.dia.n3 .pt,.dia.n4 .pt{background:#fff}

/* pantallas grandes */
@media (min-width:900px){
  .wrap{max-width:960px}
  .dosCol{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
}
@media (prefers-reduced-motion:reduce){
  .hoja{transition:none} .esqueleto i{animation:none}
}

/* ==================== luces tenues ==================== */
.fondo-app{inset:-35%}
.fondo-app b{
  width:86vmax;height:86vmax;opacity:.34;
  animation:deriva 58s ease-in-out infinite alternate, respirar 19s ease-in-out infinite;
  mix-blend-mode:normal;
}
.fondo-app b:nth-child(1){animation-duration:58s,17s;animation-delay:0s,0s}
.fondo-app b:nth-child(2){animation-duration:72s,23s;animation-delay:-14s,-4s}
.fondo-app b:nth-child(3){animation-duration:64s,21s;animation-delay:-28s,-9s}
.fondo-app b:nth-child(4){animation-duration:80s,26s;animation-delay:-9s,-15s}
html[data-tema="oscuro"] .fondo-app b{opacity:.30}
html[data-fondo="suave"] .fondo-app b{animation-duration:96s,30s!important;opacity:.24}
@keyframes respirar{0%,100%{opacity:.30}50%{opacity:.44}}
@keyframes deriva{
  0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(4%,-5%,0) scale(1.10)}
  100%{transform:translate3d(-4%,4%,0) scale(.96)}
}
#particulasApp{opacity:.34}

/* ==================== bloques menos sólidos ==================== */
.lista,.meta-c,.kpi,.barras,table,.ajuste,.vacio,.frase{
  background:color-mix(in srgb,var(--card) 55%,transparent);
  -webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
  border:1px solid color-mix(in srgb,var(--glass-borde) 80%,transparent);
  box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 22%,transparent), var(--shadow);
}
html[data-tema="oscuro"] .lista,html[data-tema="oscuro"] .meta-c,html[data-tema="oscuro"] .kpi,
html[data-tema="oscuro"] .barras,html[data-tema="oscuro"] table,html[data-tema="oscuro"] .ajuste,
html[data-tema="oscuro"] .vacio,html[data-tema="oscuro"] .frase{
  background:color-mix(in srgb,var(--card) 62%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.relojes,.medidor,.saldo,.periodo-sel,.cal,.racha-card{
  background:color-mix(in srgb,var(--card) 48%,transparent);
  box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 26%,transparent), var(--glass-sombra)}
.fila{border-bottom-color:color-mix(in srgb,var(--linea-suave) 45%,transparent)}
th{background:color-mix(in srgb,var(--th) 40%,transparent)}
/* el texto se refuerza para que la transparencia no cueste legibilidad */
.nom{font-weight:600}
.desc{color:var(--ink-2)}
html[data-tema="oscuro"] .desc{color:#B2C0CA}

/* ==================== guía por sección ==================== */
.guia{position:fixed;inset:0;z-index:88;display:none;pointer-events:auto}
.guia.act{display:block}
.foco{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(6,14,20,.66),
  0 0 0 3px var(--jade), 0 0 26px 6px color-mix(in srgb,var(--jade) 55%,transparent);
  transition:all .34s cubic-bezier(.22,.9,.3,1);pointer-events:none}
.globo{position:absolute;max-width:340px;padding:16px 17px;border-radius:16px;
  background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-borde);box-shadow:var(--glass-sombra);
  animation:surgir .28s ease both}
.globo .paso{font-family:'Space Grotesk';font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--jade);margin-bottom:7px}
.globo h4{font-family:'Fraunces',Georgia,serif;font-size:19px;margin:0 0 6px;line-height:1.2}

@media (prefers-reduced-motion:reduce){ .foco{transition:none} .fondo-app b{animation:none!important} }

/* modo simplificado */

#modalAjustes .hoja{max-height:88vh}

/* nube de sincronización */
.nube-btn{position:fixed;left:14px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:45;
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border:1px solid var(--glass-borde);box-shadow:var(--glass-sombra);color:var(--ink-3)}
.nube-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.nube-btn .punto-sync{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;
  background:var(--amber);display:none;border:2px solid var(--paper)}
.nube-btn.pend .punto-sync{display:block}
.nube-btn.ok{color:var(--jade)}
.nube-btn.subiendo{color:var(--jade)}
.nube-btn.subiendo svg{animation:latido 1.1s ease-in-out infinite}
.nube-btn.sinred{color:var(--rust)}
@keyframes latido{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.9)}}

/* estados vacíos accionables */
.vacio.tocable{cursor:pointer;border-style:solid;

.vacio.tocable b{display:block;margin-top:9px;color:var(--jade);font-weight:600;font-size:14px}

.dia.hoy:not(.sel){border-color:var(--ink-3);box-shadow:none;font-weight:700}

.dia.sel .pt{background:var(--jade)}
.dia.sel.n3 .pt,.dia.sel.n4 .pt{background:#fff}

let memoria=null, avisado=false;
async function leer(){
  try{
    if(typeof window.storage!=='undefined'&&window.storage){
      const r=await window.storage.get(CLAVE);return r?JSON.parse(r.value):null;
    }
    const r=localStorage.getItem(CLAVE);return r?JSON.parse(r):null;
  }catch(e){return memoria;}
}
async function guardarLocal(d){
  memoria=d;
  try{
    if(typeof window.storage!=='undefined'&&window.storage){await window.storage.set(CLAVE,JSON.stringify(d));return;}
    localStorage.setItem(CLAVE,JSON.stringify(d));
  }catch(e){if(!avisado){avisado=true;alert(t('noGuardo'));}}
}
async function escribir(d){
  d.actualizado=new Date().toISOString();
  await guardarLocal(d);
  programarSubida();
}

/* ============ cálculo ============ */
function semanaDe(f){
  const d=desdeIso(f);d.setDate(d.getDate()-idxSem(d));
  const l=[];for(let i=0;i<7;i++){l.push(iso(d));d.setDate(d.getDate()+1);}
  return l;
}
/* Un hábito semanal se vuelve obligatorio el día en que ya no te
   alcanzan los días que quedan para cumplir la cuota. */
function aplicaHoy(h,f){
  if(h.pausado)return false;
  const fs=typeof f==='string'?f:iso(f);
  if(h.modo==='semanal'){
    const dias=semanaDe(fs),i=dias.indexOf(fs);
    const antes=dias.slice(0,i).filter(d=>marcado(d,h.id)).length;
    const falta=(h.meta||3)-antes;
    if(falta<=0)return false;
    return falta>=(dias.length-i);
  }
  return h.dias[idxSem(desdeIso(fs))]===1;
}
/* Lo que se muestra en la lista: incluye los semanales aún pendientes. */
function mostrarDelDia(f){
  const fs=typeof f==='string'?f:iso(f);
  return D.habitos.filter(h=>{
    if(h.pausado)return false;
    if(h.modo==='semanal'){
      const dias=semanaDe(fs);
      const hechos=dias.filter(d=>marcado(d,h.id)).length;
      return hechos<(h.meta||3)||marcado(fs,h.id);
    }
    return h.dias[idxSem(desdeIso(fs))]===1;
  });
}
function hechosSemana(h,f){
  return semanaDe(typeof f==='string'?f:iso(f)).filter(d=>marcado(d,h.id)).length;
}
function mejorRachaHabito(h){
  const ini=desdeIso(primeraFecha()),fin=new Date();
  let max=0,run=0;const d=new Date(ini);
  while(d<=fin){
    const f=iso(d);
    if(aplicaHoy(h,f)){ if(marcado(f,h.id)||congelado(f)){run++;if(run>max)max=run;} else if(f<hoyIso())run=0; }
    d.setDate(d.getDate()+1);
  }
  return max;
}
function delDia(f){return D.habitos.filter(h=>aplicaHoy(h,typeof f==='string'?f:iso(f)));}
function marcado(f,id){return !!(D.registro[f]&&D.registro[f][id]);}
function pctDia(fs){const hs=delDia(desdeIso(fs));if(!hs.length)return null;
  return Math.round(hs.filter(h=>marcado(fs,h.id)).length/hs.length*100);}
function rachaHabito(h){let n=0;const d=new Date();
  for(let i=0;i<400;i++){
    if(!aplicaHoy(h,d)){d.setDate(d.getDate()-1);continue;}
    const f=iso(d);
    if(marcado(f,h.id)){n++;d.setDate(d.getDate()-1);}
    else if(f===hoyIso()){d.setDate(d.getDate()-1);}else break;}
  return n;}
function movsDelMes(d){const p=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  return D.movs.filter(m=>m.fecha.startsWith(p));}
function suma(l,tp){return l.filter(m=>m.tipo===tp).reduce((a,m)=>a+m.monto,0);}
function ahorradoEn(id){return D.movs.filter(m=>m.tipo==='ahorro'&&m.metaId===id).reduce((a,m)=>a+m.monto,0);}

/* ============ relojes ============ */
function marcasReloj(){
  let g='';
  for(let i=0;i<60;i++){
    const a=i*6*Math.PI/180,gr=i%5===0,r1=gr?38:41,r2=44;
    g+='<line class="tick'+(gr?' g':'')+'" x1="'+(50+r1*Math.sin(a)).toFixed(2)+'" y1="'+(50-r1*Math.cos(a)).toFixed(2)+
       '" x2="'+(50+r2*Math.sin(a)).toFixed(2)+'" y2="'+(50-r2*Math.cos(a)).toFixed(2)+'"/>';
  }
  document.getElementById('ticks').innerHTML=g;
}
function ticTac(){
  const n=new Date(),s=n.getSeconds(),m=n.getMinutes(),h=n.getHours()%12;
  const gira=(el,a)=>document.getElementById(el).setAttribute('transform','rotate('+a+' 50 50)');
  gira('agujaS',s*6);gira('agujaM',m*6+s*0.1);gira('agujaH',h*30+m*0.5);
  const h24=n.getHours(),h12=h24%12||12;
  document.getElementById('horaDigital').innerHTML=
    h12+':'+String(m).padStart(2,'0')+'<i>'+String(s).padStart(2,'0')+'</i><em>'+(h24<12?t('am'):t('pm'))+'</em>';
  const dl=cap(DIAS_L()[n.getDay()]);
  document.getElementById('fechaLarga').innerHTML=
    '<b>'+(idioma==='es'
      ? dl+' '+n.getDate()+' de '+MESES()[n.getMonth()]
      : dl+', '+MESES()[n.getMonth()]+' '+n.getDate())+'</b>'+
    t('semana')+' '+semanaDelAno(n)+' · '+n.getFullYear();
}

  for(let d=1;d<=ultimo;d++){
    const fecha=iso(new Date(y,m,d)),p=pctDia(fecha);

function lunesDe(d){const x=new Date(d);x.setDate(x.getDate()-idxSem(x));x.setHours(0,0,0,0);return x;}
function rango(){
  const hoy=new Date();hoy.setHours(0,0,0,0);
  let ini,fin,tit;
  if(periodo==='dia'){
    ini=new Date(hoy);ini.setDate(ini.getDate()+offset);fin=new Date(ini);
    tit=idioma==='es'?cap(DIAS_L()[ini.getDay()])+' '+ini.getDate()+' de '+MESES()[ini.getMonth()]
      :cap(DIAS_L()[ini.getDay()])+', '+MESES()[ini.getMonth()]+' '+ini.getDate();
  }else if(periodo==='semana'){
    ini=lunesDe(hoy);ini.setDate(ini.getDate()+offset*7);fin=new Date(ini);fin.setDate(fin.getDate()+6);
    tit=cap(t('semana'))+' '+semanaDelAno(ini)+' · '+ini.getDate()+' '+MESES()[ini.getMonth()].slice(0,3)+
        ' – '+fin.getDate()+' '+MESES()[fin.getMonth()].slice(0,3);
  }else{
    ini=new Date(hoy.getFullYear(),hoy.getMonth()+offset,1);
    fin=new Date(ini.getFullYear(),ini.getMonth()+1,0);
    tit=cap(MESES()[ini.getMonth()])+' '+ini.getFullYear();
  }
  const dias=[],c=new Date(ini);
  while(c<=fin){dias.push(iso(c));c.setDate(c.getDate()+1);}
  return{ini,fin,tit,dias,pasados:dias.filter(f=>f<=hoyIso())};
}
function setPeriodo(p){periodo=p;offset=0;pintarStats();}
function moverPeriodo(n){if(n>0&&offset>=0)return;offset+=n;pintarStats();}

function pintarStats(){
  pintarHallazgos();
  const R=rango();
  document.getElementById('selPeriodo').innerHTML=[['dia','pDia'],['semana','pSemana'],['mes','pMes']].map(x=>
    '<button class="'+(periodo===x[0]?'act':'')+'" onclick="setPeriodo(\''+x[0]+'\')">'+t(x[1])+'</button>').join('');
  document.getElementById('periodoTit').textContent=R.tit;
  const ad=document.querySelector('.periodo-nav button:last-child');
  if(ad)offset>=0?ad.setAttribute('disabled',''):ad.removeAttribute('disabled');

  let apl=0,cum=0;
  R.pasados.forEach(f=>{const hs=delDia(desdeIso(f));apl+=hs.length;cum+=hs.filter(h=>marcado(f,h.id)).length;});
  const pct=apl?Math.round(cum/apl*100):0;

async function alternarHabito(id,fecha){
  const f=fecha||hoyIso();
  D.registro[f]=D.registro[f]||{};
  const antes=pctDia(f);
  if(D.registro[f][id]){delete D.registro[f][id];sonQuitar();}
  else{D.registro[f][id]=true;sonMarcar();vibrar(12);}
  if(!Object.keys(D.registro[f]).length)delete D.registro[f];
  await escribir(D);pintar();
  if(pctDia(f)===100&&antes!==100){sonCompleto();vibrar([18,60,18]);chispas();
    const n=rachaGlobal(),rec=mejorRacha();
    if(HITOS.includes(n))setTimeout(()=>alert(t('hitoLogrado')+': '+nombreHito(n)+' · '+n+' '+t('diasSeguidos')),260);
    else if(n>0&&n>=rec&&rec>2)setTimeout(()=>alert(t('nuevoRecord')+' '+n+' '+t('diasSeguidos')),260);
    const e=document.getElementById('fraseDia');
    if(e){e.innerHTML='<span>'+t('fraseDia')+'</span>'+esc(fraseCierre());
          e.style.animation='none';e.offsetHeight;e.style.animation='surgir .5s ease both';}}
}
async function alternarTarea(id,fecha){
  const x=D.tareas.find(y=>y.id===id);if(!x)return;
  const f=fecha||hoyIso();
  if(x.repite&&!x.hecho){
    x.historial=x.historial||[];
    if(!x.historial.includes(f))x.historial.push(f);
    const sig=siguienteFecha(x.repite,x.fecha||f);
    x.hechoEn=f;x.fecha=sig||x.fecha;x.hecho=false;
    sonMarcar();vibrar(12);

    x.hecho=!x.hecho;x.hechoEn=x.hecho?f:null;

  }
  await escribir(D);pintar();
}

/* ============ sonido ============ */
let ac=null;
function audio(){
  if(ac)return ac;
  try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}
  return ac;
}
function tono(f,dur,vol,tipo,retraso){
  if(!(D.config&&D.config.sonido!==false))return;
  const c=audio();if(!c)return;
  if(c.state==='suspended')c.resume();
  const t0=c.currentTime+(retraso||0);
  const o=c.createOscillator(),g=c.createGain();
  o.type=tipo||'sine';o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+.02);
}
const sonMarcar =()=>tono(784,.13,.06,'sine');
const sonQuitar =()=>tono(392,.10,.04,'sine');
const sonPestana=()=>tono(587,.05,.025,'sine');
function sonCompleto(){[523,659,784,1047].forEach((f,i)=>tono(f,.30,.055,'sine',i*.075));}
function vibrar(ms){if(navigator.vibrate)try{navigator.vibrate(ms);}catch(e){}}

/* ============ partículas ============ */
const rafs={};
function iniciarParticulas(id,n){
  const c=document.getElementById(id);if(!c||!c.getContext)return;
  if(rafs[id])return;
  const x=c.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
  const quieto=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0;const ps=[];
  function dim(){W=c.width=c.offsetWidth*dpr;H=c.height=c.offsetHeight*dpr;}
  dim();addEventListener('resize',dim);
  const N=quieto?Math.round(n/2):n;
  for(let i=0;i<N;i++)ps.push({x:Math.random(),y:Math.random(),
    r:Math.random()*1.9+.9,vx:(Math.random()-.5)*.00035,vy:-(Math.random()*.00055+.00018),
    a:Math.random()*.45+.18,c:i%5});
  const CLARO=['23,112,90','10,124,140','74,69,199','181,41,127','178,106,5'];
  const OSCURO=['95,209,174','79,188,206','139,135,240','236,119,190','229,167,63'];
  function dibuja(pal){
    x.clearRect(0,0,W,H);
    for(const p of ps){
      x.beginPath();x.arc(p.x*W,p.y*H,p.r*dpr,0,6.2832);
      x.fillStyle='rgba('+pal[p.c]+','+p.a+')';x.fill();
    }
  }
  function paso(){
    const pal=document.documentElement.getAttribute('data-tema')==='oscuro'?OSCURO:CLARO;
    for(const p of ps){
      p.x+=p.vx;p.y+=p.vy;
      if(p.y<-.06){p.y=1.06;p.x=Math.random();}
      if(p.x<-.06)p.x=1.06; if(p.x>1.06)p.x=-.06;
    }
    dibuja(pal);
    rafs[id]=requestAnimationFrame(paso);
  }
  if(quieto)dibuja(document.documentElement.getAttribute('data-tema')==='oscuro'?OSCURO:CLARO);
  else paso();
}

/* ============================================================
   PLANES COMPARTIDOS — cimientos, todavía sin interfaz.
   Encender con GRUPOS.activo = true cuando exista el respaldo
   en Supabase. Ver RUTA-GRUPOS.md para el plan completo.
   ============================================================ */
const GRUPOS={
  activo:false,
  /* Un plan compartido es una tarea con dueño y participantes.
     Vive en D.planes y NO se mezcla con D.tareas hasta que se acepte,
     para que un plan ajeno nunca ensucie tu lista sin tu permiso. */
  nuevo(titulo,fecha,invitados){
    return {id:uid(),titulo,fecha,hora:null,lugar:'',
      dueno:(sesion&&sesion.user&&sesion.user.email)||null,
      invitados:(invitados||[]).map(c=>({correo:c.trim().toLowerCase(),estado:'pendiente'})),
      estado:'propuesto',   // propuesto | confirmado | cancelado | hecho
      creado:new Date().toISOString(),
      version:1};
  },
  /* Estado del plan visto desde este usuario. */
  miEstado(plan){
    const yo=(sesion&&sesion.user&&sesion.user.email)||null;
    if(!yo)return 'invitado';
    if(plan.dueno===yo)return 'dueno';
    const i=plan.invitados.find(x=>x.correo===yo);
    return i?i.estado:'ajeno';
  },
  confirmados(plan){return plan.invitados.filter(i=>i.estado==='aceptado').length+1;},
  /* Los planes aceptados se proyectan sobre el calendario y la lista
     de tareas sin duplicarse en D.tareas: se calculan al vuelo. */
  delDia(fecha){
    if(!this.activo)return [];
    return (D.planes||[]).filter(p=>p.fecha===fecha&&p.estado!=='cancelado'&&
      ['dueno','aceptado'].includes(this.miEstado(p)));
  },
  pendientesDeResponder(){
    if(!this.activo)return [];
    return (D.planes||[]).filter(p=>this.miEstado(p)==='pendiente'&&p.estado!=='cancelado');
  },
  /* Resolución de conflictos: gana la versión más alta; a igual
     versión, gana la fecha de modificación más reciente. */
  fusionar(local,remoto){
    const m={};
    (local||[]).forEach(p=>m[p.id]=p);
    (remoto||[]).forEach(p=>{
      const a=m[p.id];
      if(!a||p.version>a.version||(p.version===a.version&&p.creado>a.creado))m[p.id]=p;
    });
    return Object.values(m);
  }
};


/* ============ motor de rachas ============ */
const HITOS=[3,7,14,30,60,100,180,365];
function congelado(f){return (D.congelados||[]).includes(f);}
function congelacionesDelMes(f){
  const m=(f||hoyIso()).slice(0,7);
  return (D.congelados||[]).filter(x=>x.startsWith(m)).length;
}
function congelacionesGanadas(){
  const ini=desdeIso(primeraFecha()),fin=new Date();let perf=0;const d=new Date(ini);
  while(d<=fin){if(pctDia(iso(d))===100)perf++;d.setDate(d.getDate()+1);}
  return Math.floor(perf/30);
}
function congelacionesLibres(){
  const derecho=1+congelacionesGanadas();
  return Math.max(derecho-(D.congelados||[]).length,0);
}
function puedeCongelar(f){
  if(f>hoyIso())return false;
  if(congelado(f))return false;
  if(pctDia(f)===null)return false;
  if(pctDia(f)===100)return false;
  return congelacionesLibres()>0;
}
async function alternarCongelar(f){
  D.congelados=D.congelados||[];D.prestamos=D.prestamos||[];D.fijos=D.fijos||[];D.cierres=D.cierres||{};
  if(congelado(f))D.congelados=D.congelados.filter(x=>x!==f);
  else{
    if(!puedeCongelar(f)){alert(t('yaCongelaste'));return;}
    D.congelados.push(f);sonCompleto();vibrar([14,50,14]);
  }
  await escribir(D);pintar();
}
/* un día cuenta si lo cerraste al 100%, si lo congelaste,
   o si no tenías hábitos programados (no rompe nada) */
function diaCuenta(f){
  const p=pctDia(f);
  if(p===null)return 'salta';
  if(p===100||congelado(f))return 'si';
  return 'no';
}
function rachaGlobal(){
  let n=0;const d=new Date();
  if(diaCuenta(hoyIso())!=='si')d.setDate(d.getDate()-1);
  for(let i=0;i<800;i++){
    const r=diaCuenta(iso(d));
    if(r==='salta'){d.setDate(d.getDate()-1);continue;}
    if(r==='si'){n++;d.setDate(d.getDate()-1);}else break;
  }
  return n;
}
function primeraFecha(){
  const ks=Object.keys(D.registro||{});
  if(!ks.length)return hoyIso();
  return ks.sort()[0];
}
function mejorRacha(){
  const ini=desdeIso(primeraFecha()),fin=new Date();
  let max=0,run=0;const d=new Date(ini);
  while(d<=fin){
    const r=diaCuenta(iso(d));
    if(r==='si'){run++;if(run>max)max=run;}
    else if(r==='no')run=0;
    d.setDate(d.getDate()+1);
  }
  return max;
}
function proximoHito(n){return HITOS.find(h=>h>n)||null;}
function nombreHito(h){return t('hito'+h);}

function pintarRacha(){
  const c=document.getElementById('rachaCard');if(!c)return;
  const n=rachaGlobal(),rec=mejorRacha(),f=hoyIso();
  const hs=delDia(new Date()),ok=hs.filter(h=>marcado(f,h.id)).length,faltan=hs.length-ok;
  const hito=proximoHito(n);

  let lado;
  if(n===0)lado='<div class="g">'+t('sinRacha')+'</div><div class="r">'+t('empiezaHoy')+'</div>';
  else lado='<div class="g">'+t('diasSeguidos')+'</div><div class="r">'+t('tuRecord')+': '+rec+
       (n>=rec&&n>0?' · '+t('igualasRecord'):'')+'</div>';

  let hitoHtml='';
  if(hito){
    const ant=HITOS.filter(h=>h<=n).pop()||0;
    const p=Math.round((n-ant)/(hito-ant)*100);
    hitoHtml='<div class="racha-hito"><div class="l"><span>'+t('proxHito')+': '+nombreHito(hito)+
      '</span><b>'+(hito-n)+' '+t('diasMas')+'</b></div>'+
      '<div class="racha-barra"><i style="width:'+Math.max(p,3)+'%"></i></div></div>';
  }

  let aviso='';
  const ayer=new Date();ayer.setDate(ayer.getDate()-1);const fa=iso(ayer);
  if(faltan>0&&hs.length){
    aviso='<div class="racha-aviso">'+t('faltanPara')+' <b>'+faltan+'</b> '+
      (n>0?t('paraMantener'):t('paraEmpezar'))+'.</div>';
  }else if(hs.length&&faltan===0){
    aviso='<div class="racha-aviso ok">'+t('diaCompleto')+'</div>';
  }
  if(diaCuenta(fa)==='no'&&puedeCongelar(fa)){
    aviso+='<div class="racha-aviso"><b>'+t('rachaEnRiesgo')+'</b><br>'+t('explicaCongelar')+
      ' ('+congelacionesLibres()+' '+t('congelacionesLibres')+')'+
      '<button onclick="alternarCongelar(\''+fa+'\')">'+t('congelarAyer')+'</button></div>';
  }

  c.innerHTML='<div class="racha-top"><div class="racha-num" id="rachaNum">0</div>'+
    '<div class="racha-lado">'+lado+'</div></div>'+hitoHtml+aviso;
  contar(document.getElementById('rachaNum'),n,'',700);
}

  c.width=W;c.height=H;const x=c.getContext('2d');
  const osc=document.documentElement.getAttribute('data-tema')==='oscuro';

  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,ac2);g.addColorStop(1,ac);
  x.globalAlpha=.20;x.fillStyle=g;
  [[180,220,320],[880,380,380],[520,1180,340]].forEach(b=>{
    const rg=x.createRadialGradient(b[0],b[1],0,b[0],b[1],b[2]);

  const perf=dias.filter(f=>pctDia(f)===100).length;
  let mejor='—',mp=-1;
  D.habitos.forEach(h=>{let a=0,o=0;

    const p=a?Math.round(o/a*100):0;if(p>mp){mp=p;mejor=h.nom;}});
  x.fillStyle=tinta;x.font='600 62px Georgia, serif';x.fillText('Agenda',80,140);
  x.fillStyle=suave;x.font='500 30px system-ui';x.fillText(mes.toUpperCase(),80,190);

  const filas=[[t('diasSeguidos'),rachaGlobal()],[t('diasPerfectos'),perf+' / '+dias.length],
               [t('tuRecord'),mejorRacha()],[t('mejorHabito'),mejor.length>26?mejor.slice(0,26)+'…':mejor]];
  let y=730;

    x.textAlign='left';
    x.strokeStyle=osc?'#2B353D':'#D3D9DE';x.lineWidth=2;
    x.beginPath();x.moveTo(80,y+34);x.lineTo(W-80,y+34);x.stroke();
    y+=110;
  });
  x.fillStyle=suave;x.font='500 26px system-ui';
  x.fillText('habits · money · focus',80,H-80);
  const a=document.createElement('a');
  a.href=c.toDataURL('image/png');a.download='agenda-'+iso(d).slice(0,7)+'.png';a.click();
  sonCompleto();
}


/* ============ hallazgos ============ */
function hallazgos(){
  const dias=[],d=new Date();
  for(let i=0;i<90;i++){const f=iso(d);if(pctDia(f)!==null)dias.push(f);d.setDate(d.getDate()-1);}
  const out=[];
  if(dias.length<14)return out;

  // correlación: días con el hábito hecho vs sin hacer
  D.habitos.forEach(h=>{
    if(h.pausado)return;
    const con=[],sin=[];
    dias.forEach(f=>{
      if(!aplicaHoy(h,f))return;
      const hs=delDia(desdeIso(f)).filter(o=>o.id!==h.id);
      if(!hs.length)return;
      const p=Math.round(hs.filter(o=>marcado(f,o.id)).length/hs.length*100);
      (marcado(f,h.id)?con:sin).push(p);
    });
    if(con.length<5||sin.length<5)return;
    const pr=a=>Math.round(a.reduce((x,y)=>x+y,0)/a.length);
    const dif=pr(con)-pr(sin);
    if(dif>=10)out.push({tipo:'corr',hab:h.nom,dif,n:con.length+sin.length});
  });
  out.sort((a,b)=>b.dif-a.dif);

  // mejor y peor día de la semana
  const porDia=[[],[],[],[],[],[],[]];
  dias.forEach(f=>{const p=pctDia(f);if(p!==null)porDia[idxSem(desdeIso(f))].push(p);});
  const prom=porDia.map(a=>a.length>=3?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null);
  const val=prom.map((v,i)=>({v,i})).filter(x=>x.v!==null);
  if(val.length>=5){
    const mej=val.reduce((a,b)=>b.v>a.v?b:a),peo=val.reduce((a,b)=>b.v<a.v?b:a);
    if(mej.v-peo.v>=12){
      out.push({tipo:'dia',mejor:mej,peor:peo});
    }
  }
  return out.slice(0,4);
}
function pintarHallazgos(){
  const c=document.getElementById('listaHallazgos');if(!c)return;
  const l=hallazgos();
  if(!l.length){c.innerHTML=vacio(t('sinHallazgos'),'grafica');return;}
  const nomDia=i=>cap(DIAS_L()[(i+1)%7]);
  c.innerHTML='<div class="lista">'+l.map(x=>{
    if(x.tipo==='corr')
      return '<div class="hallazgo"><b>'+esc(x.hab)+'</b>'+
        t('corrMejor')+' <span class="cifra">'+esc(x.hab.toLowerCase())+'</span>, '+t('corrSube')+
        ' <span class="cifra">'+x.dif+'</span> '+t('corrPuntos')+'.</div>';
    return '<div class="hallazgo"><b>'+t('mejorDia')+': '+nomDia(x.mejor.i)+'</b>'+

/* ============ notificaciones push ============ */
const VAPID='BJFbAJYjpfa-awd1PWkpZfgoyM3JsHVrLcTGjyoxXj4wm0buzB-JrtEviz-BzrVA1jZuJHZOgHmBORT5h03j5Ig';
function b64aBytes(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const s=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(s),arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
  return arr;
}
function bytesAB64(buf){
  return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));
}
function pushSoportado(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
function esStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
}
function esIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent);}

async function activarNotifs(){
  if(!sesion){aviso(t('notifs'),t('notifsNoSesion'));return;}
  if(!pushSoportado()||(esIOS()&&!esStandalone())){
    aviso(t('notifs'),t('notifsInstalar'));return;
  }
  const permiso=await Notification.requestPermission();
  if(permiso!=='granted'){aviso(t('notifs'),t('notifsNegado'));pintarNotifs();return;}
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64aBytes(VAPID)});
    const j=sub.toJSON();
    const {error}=await sb.from('push_subs').upsert({
      endpoint:sub.endpoint,user_id:sesion.user.id,
      p256dh:j.keys.p256dh,auth:j.keys.auth,
      tz_min:new Date().getTimezoneOffset(),idioma:idioma,
      actualizado:new Date().toISOString()
    });
    if(error)throw error;
    sonCompleto();
    aviso(t('notifs'),D.habitos.some(h=>h.aviso)?t('notifsOn'):t('notifsSinHora'));
  }catch(e){aviso(t('notifs'),t('notifsError'));}
  pintarNotifs();
}
async function desactivarNotifs(){
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub){
      if(sb&&sesion)await sb.from('push_subs').delete().eq('endpoint',sub.endpoint);
      await sub.unsubscribe();
    }
  }catch(e){}
  pintarNotifs();
}
async function pintarNotifs(){
  const c=document.getElementById('bloqueNotifs');if(!c)return;
  let activo=false;
  try{
    if(pushSoportado()&&Notification.permission==='granted'){
      const reg=await navigator.serviceWorker.ready;
      activo=!!(await reg.pushManager.getSubscription());
    }
  }catch(e){}
  let nota='';
  if(esIOS()&&!esStandalone())nota=t('notifsInstalar');
  else if(!sesion)nota=t('notifsNoSesion');
  else if(activo&&!D.habitos.some(h=>h.aviso))nota=t('notifsSinHora');
  c.innerHTML='<div class="nom">'+(activo?t('notifsOn'):t('notifsOff'))+'</div>'+
    '<div class="desc" style="margin:6px 0 11px">'+(nota||t('notifsDesc'))+'</div>'+
    (activo
      ? '<button class="btn ghost" onclick="desactivarNotifs()">'+t('desactivarNotifs')+'</button>'
      : '<button class="btn" onclick="activarNotifs()">'+t('activarNotifs')+'</button>');
}

/* ============ números que cuentan ============ */
function contar(el,fin,sufijo,ms){
  if(!el)return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=fin+(sufijo||'');return;}
  const ini=parseInt(String(el.dataset.v||0),10)||0;
  if(ini===fin){el.textContent=fin+(sufijo||'');return;}
  el.dataset.v=fin;
  const t0=performance.now(),dur=ms||600;
  function paso(t){
    const p=Math.min((t-t0)/dur,1);
    const e=1-Math.pow(1-p,3);
    el.textContent=Math.round(ini+(fin-ini)*e)+(sufijo||'');
    if(p<1)requestAnimationFrame(paso);
  }
  requestAnimationFrame(paso);
}

/* ============ chispas al cerrar el día ============ */
function chispas(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.getElementById('particulasApp');
  if(!c)return;
  const x=c.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
  const W=c.width,H=c.height,cx=W/2,cy=H*0.32;
  const cols=document.documentElement.getAttribute('data-tema')==='oscuro'
    ? ['95,209,174','79,188,206','139,135,240','236,119,190','229,167,63']
    : ['23,112,90','10,124,140','74,69,199','181,41,127','178,106,5'];
  const ps=[];
  for(let i=0;i<46;i++){
    const a=Math.random()*6.2832,v=(Math.random()*5+2.2)*dpr;
    ps.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5*dpr,
             r:(Math.random()*3+1.6)*dpr,a:1,c:cols[i%cols.length]});
  }
  const t0=performance.now();
  function paso(t){
    const el=(t-t0)/1100;
    if(el>=1)return;
    x.clearRect(0,0,W,H);
    ps.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.16*dpr;p.vx*=0.985;p.a=1-el;
      x.beginPath();x.arc(p.x,p.y,p.r*(1-el*0.5),0,6.2832);
      x.fillStyle='rgba('+p.c+','+Math.max(p.a,0).toFixed(2)+')';x.fill();
    });
    requestAnimationFrame(paso);
  }
  requestAnimationFrame(paso);
}

/* ============ campo rápido con lenguaje natural ============ */
function leerFrase(txt){
  const r={nom:txt,fecha:hoyIso(),pri:'media',monto:null};
  let s2=' '+txt.toLowerCase()+' ';
  // prioridad con !
  if(/!/.test(txt)){r.pri='alta';r.nom=r.nom.replace(/!+/g,'').trim();}
  // monto con $
  const m=txt.match(/\$\s?([\d.,]+)/);
  if(m){r.monto=parseFloat(m[1].replace(/,/g,''));r.nom=r.nom.replace(m[0],'').trim();}
  // fechas
  const dias=['fLunes','fMartes','fMiercoles','fJueves','fViernes','fSabado','fDomingo'];
  const quita=p=>{r.nom=r.nom.replace(new RegExp(p,'i'),'').replace(/\s{2,}/g,' ').trim();};
  const enDias=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d);};
  const mDias=s2.match(/en\s+(\d+)\s+d[ií]as?/);
  if(mDias){r.fecha=enDias(parseInt(mDias[1],10));quita('en\\s+'+mDias[1]+'\\s+d[ií]as?');}
  else if(s2.includes(' '+t('fPasadoP')+' ')){r.fecha=enDias(2);quita(t('fPasadoP'));}
  else if(s2.includes(' '+t('fMananaP')+' ')){r.fecha=enDias(1);quita(t('fMananaP'));}
  else if(s2.includes(' '+t('fHoyP')+' ')){r.fecha=hoyIso();quita(t('fHoyP'));}
  else{
    for(let i=0;i<7;i++){
      const nom=t(dias[i]);
      if(s2.includes(' '+nom+' ')){
        const hoy=new Date();let d=(i-idxSem(hoy)+7)%7; if(d===0)d=7;
        r.fecha=enDias(d);quita(nom);break;
      }
    }
  }
  r.nom=r.nom.replace(/\s{2,}/g,' ').trim();
  return r;
}
async function agregarRapido(){
  const e=document.getElementById('rapidoTarea');
  const bruto=e.value.trim();if(!bruto)return;
  const r=leerFrase(bruto);
  if(!r.nom)return;
  D.tareas.push({id:uid(),nom:r.nom,desc:'',fecha:r.fecha,pri:r.pri,
    cat:t('catsTarea')[0],hecho:false,historial:[]});
  e.value='';sonMarcar();await escribir(D);pintar();
  if(r.monto)proponerGasto(r.nom,r.monto);
}

function proyeccion(cat,gastadoReal){
  const tope=(D.presupuestos||{})[cat];
  if(!tope)return null;
  const hoy=new Date();
  const mesVisto=iso(mesDinero).slice(0,7)===hoyIso().slice(0,7);
  if(!mesVisto)return null;
  const dia=hoy.getDate();
  if(dia<5)return null;                       // muy pronto para proyectar
  const finMes=new Date(hoy.getFullYear(),hoy.getMonth()+1,0).getDate();
  // los gastos fijos no se proyectan: caen una vez al mes
  const idsFijos=new Set((D.fijos||[]).map(f=>f.id));
  const variable=movsDelMes(mesDinero)
    .filter(m=>m.tipo==='gasto'&&m.cat===cat&&!idsFijos.has(m.fijo))
    .reduce((a,m)=>a+m.monto,0);
  const fijoDelMes=gastadoReal-variable;
  const proy=fijoDelMes+(variable/dia)*finMes;
  if(proy<=tope)return null;
  return Math.round(proy);
}

/* ============ filtro de hábitos ============ */
let filtroHab='activos';
function pintarFiltroHabitos(){
  const c=document.getElementById('filtroHabitos');if(!c)return;
  const hayPausados=D.habitos.some(h=>h.pausado);
  if(!hayPausados){c.innerHTML='';return;}
  c.innerHTML=[['activos','fActivos'],['pausados','fPausados']].map(o=>
    '<button class="'+(filtroHab===o[0]?'act':'')+'" onclick="setFiltroHab(\''+o[0]+'\')">'+t(o[1])+'</button>').join('');
}
function setFiltroHab(v){filtroHab=v;sonPestana();pintarHabitos();}
